<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#542d1b">
<title>REFAEI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');

:root{
  --bg:#eee9df;
  --paper:#f8f5ef;
  --brown:#4b2718;
  --brown-dark:#2b160d;
  --brown-light:#79543d;
  --gold:#b89557;
  --gold-light:#d7bd86;
  --green:#198754;
  --red:#b84038;
  --border:#d9cebd;
  --white:#fffdf9;
  --shadow:0 20px 55px rgba(75,39,24,.12);
  --shadow-soft:0 8px 25px rgba(75,39,24,.08);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }

body{
  background:
    radial-gradient(circle at 15% 10%,rgba(184,149,87,.12),transparent 25%),
    radial-gradient(circle at 90% 30%,rgba(75,39,24,.08),transparent 28%),
    var(--bg);
  color:var(--brown-dark);
  font-family:'Cairo',Tahoma,Arial,sans-serif;
  line-height:1.8;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.24;
  background-image:
    linear-gradient(45deg,transparent 48%,rgba(75,39,24,.035) 49%,transparent 51%),
    linear-gradient(-45deg,transparent 48%,rgba(75,39,24,.025) 49%,transparent 51%);
  background-size:34px 34px;
}

button,input,textarea,select{ font:inherit; }
button{ cursor:pointer; transition:.25s ease; }

.container{ width:min(1180px,92%); margin:auto; }
.hidden{ display:none!important; }

/* الشريط العلوي */
.topbar{
  background:linear-gradient(90deg,var(--brown-dark),var(--brown),var(--brown-dark));
  color:#f7ead7;

  width:100%;
  display:flex;
  align-items:center;
  justify-content:center; /* ✅ بالمنتصف */
  text-align:center;

  padding:8px 15px;
  font-size:12px;
  letter-spacing:.3px;
}

/* الرأس */
header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(248,245,239,.88);
  border-bottom:1px solid rgba(75,39,24,.13);
  backdrop-filter:blur(18px);
  box-shadow:0 5px 25px rgba(75,39,24,.05);
}

/* ✅ تعديل: خلّي روابط المتجر في المنتصف مع بقاء السلة بمكانها */
.nav{
  min-height:82px;
  display:grid;
  grid-template-columns: auto 1fr auto; /* brand | nav | cart */
  align-items:center;
  gap:25px;
}

/* left/right placement في RTL: العنصر الأول (brand) يمين، والعنصر الأخير (السلة) يسار */
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--brown);
  text-decoration:none;
  white-space:nowrap;
}

.brand-mark{
  width:48px; height:48px;
  display:grid; place-items:center;
  border:1px solid var(--gold);
  border-radius:50%;
  background:
    radial-gradient(circle,#fff8e9 0 55%,transparent 56%),
    var(--brown);
  color:var(--gold-light);
  font-size:24px;
  box-shadow:0 5px 16px rgba(75,39,24,.15);
}

.brand-name{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:800;
  font-size:25px;
  letter-spacing:3px;
}

nav{
  display:flex;
  align-items:center;
  justify-content:center; /* ✅ الروابط بالمنتصف */
  gap:28px;
}

nav a{
  position:relative;
  color:var(--brown);
  text-decoration:none;
  font-size:14px;
  white-space:nowrap;
  transition:.25s;
}

nav a::after{
  content:"";
  position:absolute;
  right:0;
  bottom:-8px;
  width:0;
  height:2px;
  background:var(--gold);
  transition:.25s;
}

nav a:hover{ color:var(--gold); }
nav a:hover::after{ width:100%; }

.nav-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.cart-btn{
  border:0;
  border-radius:30px;
  color:#fff;
  padding:9px 15px;
  text-decoration:none;
  font-size:12px;
  white-space:nowrap;
  box-shadow:0 5px 15px rgba(75,39,24,.12);
  background:var(--brown);
}

.cart-btn:hover{
  background:var(--brown-dark);
  transform:translateY(-2px);
}

.cart-count{
  display:inline-grid;
  place-items:center;
  min-width:21px;
  height:21px;
  background:var(--gold-light);
  color:var(--brown-dark);
  border-radius:50%;
  padding:1px 5px;
  margin-right:4px;
  font-size:11px;
  font-weight:bold;
}

/* الواجهة الرئيسية */
.hero{
  position:relative;
  min-height:680px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:65px 0 95px;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:580px;
  height:580px;
  right:-210px;
  top:-170px;
  border:1px solid rgba(184,149,87,.26);
  border-radius:50%;
  box-shadow:
    0 0 0 35px rgba(184,149,87,.05),
    0 0 0 70px rgba(184,149,87,.035);
}

.hero-content{
  position:relative;
  z-index:1;
  width:min(760px,94%);
}

.logo{
  width:300px; height:330px;
  margin:0 auto 0;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 20px 25px rgba(75,39,24,.15));
}

.logo img{ width:100%; height:100%; object-fit:contain; }

.hero h1{
  color:var(--brown);
  font-family:'Playfair Display',Georgia,serif;
  font-weight:800;
  font-size:58px;
  letter-spacing:6px;
  line-height:1.15;
  text-shadow:2px 3px 0 rgba(184,149,87,.12);
}

.hero p{
  color:var(--brown-light);
  margin:15px auto 25px;
  font-size:16px;
  max-width:600px;
}

.main-btn,.primary-btn{
  position:relative;
  overflow:hidden;
  border:0;
  background:var(--brown);
  color:#fff;
  border-radius:4px;
  padding:12px 32px;
  box-shadow:0 10px 22px rgba(75,39,24,.2);
}

.main-btn::before,.primary-btn::before{
  content:"";
  position:absolute;
  top:0;
  right:-100%;
  width:70%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transform:skewX(-20deg);
  transition:.5s;
}

.main-btn:hover::before,.primary-btn:hover::before{ right:130%; }
.main-btn:hover,.primary-btn:hover{
  background:var(--gold);
  transform:translateY(-3px);
}

/* الأقسام */
.categories-section,.products-section{ display:none; }
.categories-section.visible,.products-section.visible{
  display:block;
  animation:fadeUp .6s ease both;
}

@keyframes fadeUp{
  from{ opacity:0; transform:translateY(20px); }
  to{ opacity:1; transform:translateY(0); }
}

.section{ padding:90px 0; }

.heading{
  position:relative;
  text-align:center;
  margin-bottom:38px;
}

.heading::after{
  content:"";
  display:block;
  width:65px;
  height:2px;
  margin:15px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.heading small{
  color:var(--gold);
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
}

.heading h2{
  color:var(--brown);
  font-family:'Playfair Display',Georgia,serif;
  font-size:38px;
  font-weight:700;
  margin-top:4px;
}

.heading p{ color:#947d69; font-size:13px; }

/* بطاقات الأقسام */
.categories{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
}

.category-card{
  position:relative;
  width:190px;
  background:rgba(255,253,249,.8);
  border:1px solid var(--border);
  border-radius:5px;
  padding:12px;
  text-align:center;
  overflow:hidden;
  box-shadow:var(--shadow-soft);
  transition:.3s ease;
  cursor:pointer;
}

.category-card::before{
  content:"";
  position:absolute;
  inset:0;
  border-top:3px solid var(--gold);
  opacity:0;
  transition:.3s;
}

.category-card:hover{
  transform:translateY(-9px);
  box-shadow:var(--shadow);
  border-color:var(--gold-light);
}

.category-card:hover::before{ opacity:1; }

.category-placeholder{
  height:115px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(135deg,rgba(184,149,87,.22),rgba(75,39,24,.08)),
    #e8ddce;
  border-radius:3px;
  color:var(--brown);
  font-size:42px;
  margin-bottom:12px;
}

.center{ text-align:center; margin-top:28px; }

.all-btn{
  border:1px solid var(--brown);
  background:transparent;
  color:var(--brown);
  border-radius:4px;
  padding:9px 18px;
}

/* المنتجات */
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}

.product{
  background:rgba(255,253,249,.9);
  border:1px solid var(--border);
  border-radius:5px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:var(--shadow-soft);
  transition:.3s ease;
}

.product:hover{
  transform:translateY(-8px);
  box-shadow:var(--shadow);
  border-color:var(--gold-light);
}

.product-img{
  width:100%;
  height:330px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 15%,rgba(184,149,87,.28),transparent 28%),
    linear-gradient(135deg,#d8c4ac,#f4eadc);
  color:var(--brown);
  font-size:55px;
}

.product-img::after{
  content:"";
  position:absolute;
  inset:13px;
  border:1px solid rgba(75,39,24,.12);
  pointer-events:none;
}

.product-img img{
  width:100%; height:100%;
  object-fit:contain;
  position:relative; z-index:1;
  transition:.4s;
}

.product:hover .product-img img{ transform:scale(1.06); }

.stock-badge{
  position:absolute;
  z-index:2;
  top:14px;
  right:14px;
  background:var(--green);
  color:#fff;
  padding:4px 9px;
  border-radius:3px;
  font-size:11px;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}
.stock-badge.out{ background:var(--red); }

.product-info{
  min-height:220px;
  padding:18px;
  background:var(--white);
  display:flex;
  flex-direction:column;
}

.product-info small{
  color:var(--gold);
  font-size:11px;
  font-weight:bold;
}

.product-info h3{
  color:var(--brown);
  font-size:18px;
  margin:3px 0 4px;
}

.product-info p{
  color:#947d69;
  font-size:13px;
  line-height:1.8;
}

.product-bottom{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:8px;
  margin-top:auto;
  padding-top:15px;
}

.price{
  color:var(--brown);
  font-size:19px;
  font-weight:bold;
  white-space:nowrap;
}

.add-btn{
  border:0;
  background:var(--brown);
  color:#fff;
  padding:9px 13px;
  border-radius:3px;
  font-size:12px;
}

.about{
  position:relative;
  background:
    linear-gradient(135deg,rgba(43,22,13,.95),rgba(75,39,24,.96)),
    var(--brown);
  color:#fff;
  text-align:center;
  overflow:hidden;
}
footer{
  background:#24130c;
  color:#eaded0;
  text-align:center;
  padding:23px;
  font-size:12px;
}

/* السلة */
.overlay{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  background:rgba(24,12,7,.62);
  backdrop-filter:blur(4px);
}
.overlay.show{ display:block; }

.cart-panel{
  position:fixed;
  z-index:50;
  top:0;
  left:-450px;
  width:min(450px,94%);
  height:100vh;
  overflow:auto;
  background:
    linear-gradient(rgba(248,245,239,.96),rgba(238,233,223,.98)),
    var(--bg);
  padding:24px;
  transition:.4s cubic-bezier(.77,0,.18,1);
  box-shadow:15px 0 45px rgba(0,0,0,.18);
}
.cart-panel.open{ left:0; }

.cart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
  padding-bottom:13px;
  margin-bottom:18px;
}

.close{
  border:0;
  background:transparent;
  color:var(--brown);
  font-size:29px;
}

.cart-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  background:var(--white);
  border:1px solid var(--border);
  border-right:4px solid var(--gold);
  padding:13px;
  margin-bottom:11px;
  border-radius:3px;
  box-shadow:var(--shadow-soft);
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.qty button{
  width:27px; height:27px;
  border:1px solid var(--brown);
  border-radius:50%;
  background:#fff;
  color:var(--brown);
}

.remove{
  border:0;
  background:transparent;
  color:var(--red);
  font-size:11px;
  margin-top:4px;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid var(--border);
  padding-top:15px;
  margin-top:18px;
  color:var(--brown);
  font-weight:bold;
  font-size:18px;
}

.whatsapp{
  width:100%;
  border:0;
  background:var(--green);
  color:#fff;
  padding:13px;
  border-radius:4px;
  margin-top:16px;
  box-shadow:0 7px 15px rgba(25,135,84,.18);
}

.customer-form{ display:none; margin-top:14px; }
.customer-form.show{ display:block; animation:fadeUp .35s ease both; }

.customer-form input,.customer-form textarea{
  width:100%;
  border:1px solid var(--border);
  padding:11px;
  margin-bottom:10px;
  border-radius:4px;
  background:#fffdf9;
  outline:none;
}

/* متجاوب */
@media(max-width:900px){
  .products{ grid-template-columns:repeat(2,1fr); }
}
@media(max-width:600px){
  .products{ grid-template-columns:repeat(2,1fr); gap:10px; }
  nav{ justify-content:center; overflow-x:auto; white-space:nowrap; }
}
@media(max-width:380px){
  .products{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="topbar" id="topbarText"></div>

<header>
  <div class="container nav">

    <a href="#home" class="brand" onclick="showStore(event)">
      <span class="brand-mark">𓅃</span>
      <span class="brand-name" id="brandName"></span>
    </a>

    <nav>
      <a href="#home" onclick="showStore(event)">الرئيسية</a>
      <a href="#categories" onclick="showCategoriesPage(event)">الأقسام</a>
      <a href="#products" onclick="showProductsPage(event)">المنتجات</a>
      <a href="#about" onclick="showAboutPage(event)">عن المتجر</a>
    </nav>

    <div class="nav-actions">
      <button class="cart-btn" onclick="openCart()">
        السلة
        <span id="cartCount" class="cart-count">0</span>
      </button>
    </div>

  </div>
</header>

<main id="storePage">

  <section class="hero" id="home">
    <div class="hero-content">

      <div class="logo">
        <img src="logo.png" alt="REFAEI" onerror="this.style.display='none'">
      </div>

      <h1 id="heroTitle"></h1>
      <p id="heroDescription"></p>

      <button class="main-btn" onclick="showShoppingContent()">
        تسوق الآن
      </button>

    </div>
  </section>

  <section class="section categories-section" id="categories">
    <div class="container">

      <div class="heading">
        <small>اكتشف اختياراتنا</small>
        <h2>أقسام المتجر</h2>
        <p>اضغط على القسم لعرض منتجاته</p>
      </div>

      <div class="categories" id="categoriesList"></div>

      <div class="center">
        <button class="all-btn" onclick="showAllProducts()">
          عرض كل المنتجات
        </button>
      </div>

    </div>
  </section>

  <section class="section products-section" id="products">
    <div class="container">

      <div class="heading">
        <small>منتجات REFAEI</small>
        <h2 id="productsTitle">جميع المنتجات</h2>
        <p>اختر المنتج وأضفه إلى السلة</p>
      </div>

      <div class="products" id="productsGrid"></div>

    </div>
  </section>

  <section class="section about" id="about">
    <div class="container">
      <h2 id="aboutTitle"></h2>
      <p id="aboutText"></p>
    </div>
  </section>

  <footer id="footerText"></footer>

</main>

<div id="adminPage" class="hidden"></div>

<div id="overlay" class="overlay" onclick="closeCart()"></div>

<aside id="cartPanel" class="cart-panel">

  <div class="cart-head">
    <h2>سلة المشتريات</h2>
    <button class="close" onclick="closeCart()">×</button>
  </div>

  <div id="cartItems"></div>

  <div id="cartSummary" class="hidden">

    <div class="cart-total">
      <span>السعر النهائي</span>
      <span id="cartTotal">0.00 د.ك</span>
    </div>

    <button class="whatsapp" onclick="showCustomerForm()">
      إتمام الطلب (الدفع عبر عربكس)
    </button>

    <div id="customerForm" class="customer-form">

      <input id="customerName" placeholder="الاسم الكامل">
      <input id="customerPhone" placeholder="رقم الهاتف">
      <input id="customerAddress" placeholder="العنوان">

      <textarea id="customerNote"
                rows="3"
                placeholder="ملاحظات إضافية"></textarea>

      <button class="primary-btn"
              style="width:100%"
              onclick="sendOrder()">
        إرسال الطلب
      </button>

    </div>

  </div>
</aside>

<script>
const SUPABASE_URL = "https://mvsdblzjzrscnfgiqxan.supabase.co";
const SUPABASE_KEY = "sb_publishable_KWMjd7EDbWtH2Ay7TdJwZg_s2et1Hc7";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let categories = [];
let products = [];
let cart = [];

const defaultSettings = {
  topbar:"توصيل راقٍ واختيارات مختارة بعناية من REFAEI",
  brandName:"REFAEI",
  heroTitle:"REFAEI",
  heroDescription:"أقمشة مختارة، شالات كشميرية، ومسابيح بطابع فاخر",
  aboutTitle:"عن REFAEI",
  aboutText:"نختار لكم المنتجات بعناية لنقدم منتجات تجمع بين الجودة والذوق والأصالة.",
  footer:"© 2025 REFAEI — جميع الحقوق محفوظة",
  whatsapp:"96566771506"
};

let settings = {...defaultSettings};

function safe(text){
  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeText(value){
  return String(value ?? "")
    .trim()
    .replace(/\s+/g,"")
    .replace(/[إأآا]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه");
}

function sameCategory(first,second){
  const a = normalizeText(first);
  const b = normalizeText(second);

  const aliases = {
    "مسباح":"مسابيح",
    "مسابيح":"مسابيح",
    "قماش":"اقمشه",
    "اقمشه":"اقمشه",
    "شال":"شالات",
    "شالات":"شالات"
  };

  return (aliases[a] || a) === (aliases[b] || b);
}

async function loadAllData(){
  const categoriesResult = await supabaseClient
    .from("categories")
    .select("*")
    .order("created_at",{ascending:true});

  const productsResult = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  const settingsResult = await supabaseClient
    .from("site_settings")
    .select("*")
    .eq("id",1)
    .maybeSingle();

  categories = categoriesResult.error ? [] : (categoriesResult.data || []);
  products = productsResult.error ? [] : (productsResult.data || []);

  if(!settingsResult.error && settingsResult.data){
    const row = settingsResult.data;
    settings = {
      topbar:row.topbar ?? defaultSettings.topbar,
      brandName:row.brand_name ?? defaultSettings.brandName,
      heroTitle:row.hero_title ?? defaultSettings.heroTitle,
      heroDescription:row.hero_description ?? defaultSettings.heroDescription,
      aboutTitle:row.about_title ?? defaultSettings.aboutTitle,
      aboutText:row.about_text ?? defaultSettings.aboutText,
      footer:row.footer ?? defaultSettings.footer,
      whatsapp:row.whatsapp ?? defaultSettings.whatsapp
    };
  }
}

function getCategoryEmoji(name){
  const text = String(name || "").toLowerCase();

  if(text.includes("قماش") || text.includes("أقمشة") || text.includes("اقمشه")) return "🧵";
  if(text.includes("شال") || text.includes("شالات") || text.includes("كشمير")) return "🧣";
  if(text.includes("مسباح") || text.includes("مسابيح")) return "📿";
  if(text.includes("بخور")) return "🌫️";
  if(text.includes("ذهب") || text.includes("مجوهرات")) return "💎";
  if(text.includes("هدايا") || text.includes("هدية")) return "🎁";

  return "🛍️";
}

function renderSettings(){
  document.getElementById("topbarText").textContent = settings.topbar;
  document.getElementById("brandName").textContent = settings.brandName;
  document.getElementById("heroTitle").textContent = settings.heroTitle;
  document.getElementById("heroDescription").textContent = settings.heroDescription;
  document.getElementById("aboutTitle").textContent = settings.aboutTitle;
  document.getElementById("aboutText").textContent = settings.aboutText;
  document.getElementById("footerText").textContent = settings.footer;
}

function renderCategories(){
  const list = document.getElementById("categoriesList");
  if(!list) return;

  if(!categories.length){
    list.innerHTML = `<p style="text-align:center;color:#927c6a">لا توجد أقسام مضافة حاليًا</p>`;
    return;
  }

  list.innerHTML = categories.map(category => {
    const categoryName = String(category.name || "");
    const count = products.filter(p => sameCategory(p.category, categoryName)).length;

    return `
      <div class="category-card"
           role="button"
           tabindex="0"
           onclick="filterProductsByCategory(this.dataset.category)"
           onkeydown="if(event.key==='Enter' || event.key===' '){ event.preventDefault(); this.click(); }"
           data-category="${safe(categoryName)}">

        <div class="category-placeholder">${getCategoryEmoji(categoryName)}</div>

        <div class="category-name">${safe(categoryName)}</div>

        <small>${count} منتج</small>
      </div>
    `;
  }).join("");
}

function renderProducts(categoryName = ""){
  const grid = document.getElementById("productsGrid");
  if(!grid) return;

  let visibleProducts = products;

  if(categoryName){
    visibleProducts = products.filter(product =>
      sameCategory(product.category_name || product.category, categoryName)
    );
    document.getElementById("productsTitle").textContent = categoryName;
  }else{
    document.getElementById("productsTitle").textContent = "جميع المنتجات";
  }

  if(!visibleProducts.length){
    grid.innerHTML = `
      <p style="grid-column:1/-1;text-align:center;color:#927c6a">
        لا توجد منتجات في هذا القسم
      </p>
    `;
    return;
  }

  grid.innerHTML = visibleProducts.map(product => {
    const stock = Number(product.stock || 0);
    const isOut = stock <= 0;

    const image = product.image_url
      ? `<img src="${safe(product.image_url)}" alt="${safe(product.name)}" onerror="this.style.display='none'">`
      : getCategoryEmoji(product.category_name || product.category);

    return `
      <article class="product">
        <div class="product-img">
          ${image}
          <span class="stock-badge ${isOut ? "out" : ""}">
            ${isOut ? "نفدت الكمية" : `متوفر: ${stock}`}
          </span>
        </div>

        <div class="product-info">
          <small>${safe(product.category_name || product.category || "")}</small>
          <h3>${safe(product.name)}</h3>
          <p>${safe(product.description || "")}</p>

          <div class="product-bottom">
            <span class="price">${Number(product.price || 0).toFixed(2)} د.ك</span>

            <button class="add-btn"
                    ${isOut ? "disabled" : ""}
                    onclick="addToCart('${safe(product.id)}')">
              ${isOut ? "غير متوفر" : "أضف للسلة"}
            </button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

/* --- إظهار/إخفاء الأقسام والمنتجات حسب الأزرار --- */
function showShoppingContent(){
  document.querySelector(".categories-section")?.classList.add("visible");
  document.getElementById("categories")?.scrollIntoView({ behavior:"smooth" });
}
function showStore(event){
  if(event) event.preventDefault();
  document.getElementById("storePage")?.scrollIntoView({ top:0, behavior:"smooth" });
}
function showCategoriesPage(event){
  if(event) event.preventDefault();
  document.querySelector(".categories-section")?.classList.add("visible");
  document.getElementById("categories")?.scrollIntoView({ behavior:"smooth" });
}
function showProductsPage(event){
  if(event) event.preventDefault();
  document.querySelector(".products-section")?.classList.add("visible");
  renderProducts();
  document.getElementById("products")?.scrollIntoView({ behavior:"smooth" });
}
function showAboutPage(event){
  if(event) event.preventDefault();
  document.getElementById("about")?.scrollIntoView({ behavior:"smooth" });
}
function showAllProducts(){
  document.querySelector(".products-section")?.classList.add("visible");
  renderProducts();
  document.getElementById("products")?.scrollIntoView({ behavior:"smooth" });
}
function filterProductsByCategory(categoryName){
  document.querySelector(".products-section")?.classList.add("visible");
  renderProducts(categoryName);
  setTimeout(() => {
    document.getElementById("products")?.scrollIntoView({ behavior:"smooth", block:"start" });
  }, 100);
}

/* --- السلة --- */
function addToCart(productId){
  const product = products.find(item => String(item.id) === String(productId));
  if(!product) return;

  const stock = Number(product.stock || 0);
  if(stock <= 0){
    alert("هذا المنتج غير متوفر حاليًا");
    return;
  }

  const existing = cart.find(item => String(item.id) === String(product.id));

  if(existing){
    if(existing.quantity >= stock){
      alert("لا يمكن إضافة كمية أكبر من المخزون");
      return;
    }
    existing.quantity += 1;
  }else{
    cart.push({ ...product, quantity:1 });
  }

  saveCart();
  renderCart();
  alert("تمت إضافة المنتج إلى السلة");
}

function saveCart(){
  localStorage.setItem("refaei_cart", JSON.stringify(cart));
}

function loadCart(){
  try{
    const saved = JSON.parse(localStorage.getItem("refaei_cart") || "[]");
    cart = Array.isArray(saved) ? saved : [];
  }catch(e){
    cart = [];
  }
}

function getCartTotal(){
  return cart.reduce((total,item) =>
    total + Number(item.price || 0) * Number(item.quantity || 0), 0
  );
}

function renderCart(){
  const itemsElement = document.getElementById("cartItems");
  const countElement = document.getElementById("cartCount");
  const summaryElement = document.getElementById("cartSummary");
  const totalElement = document.getElementById("cartTotal");

  if(!itemsElement) return;

  const totalCount = cart.reduce((t,item) => t + Number(item.quantity || 0), 0);
  countElement.textContent = totalCount;

  if(!cart.length){
    itemsElement.innerHTML = `<p style="text-align:center;color:#927c6a">السلة فارغة حاليًا</p>`;
    summaryElement.classList.add("hidden");
    return;
  }

  summaryElement.classList.remove("hidden");

  itemsElement.innerHTML = cart.map(item => {
    const lineTotal = Number(item.price || 0) * Number(item.quantity || 0);
    return `
      <div class="cart-item">
        <div>
          <h4>${safe(item.name)}</h4>

          <p>
            ${Number(item.price || 0).toFixed(2)} د.ك × ${item.quantity} = ${lineTotal.toFixed(2)} د.ك
          </p>

          <div class="qty">
            <button onclick="changeCartQuantity('${safe(item.id)}',-1)">−</button>
            <span>${item.quantity}</span>
            <button onclick="changeCartQuantity('${safe(item.id)}',1)">+</button>
          </div>

          <button class="remove" onclick="removeFromCart('${safe(item.id)}')">
            حذف المنتج
          </button>
        </div>
      </div>
    `;
  }).join("");

  totalElement.textContent = `${getCartTotal().toFixed(2)} د.ك`;
}

function changeCartQuantity(productId, amount){
  const item = cart.find(p => String(p.id) === String(productId));
  if(!item) return;

  const product = products.find(p => String(p.id) === String(productId));
  const stock = Number(product?.stock ?? item.stock ?? 0);

  item.quantity += amount;

  if(item.quantity <= 0){
    cart = cart.filter(p => String(p.id) !== String(productId));
  }else if(item.quantity > stock){
    item.quantity = stock;
    alert("لا يمكن تجاوز الكمية المتوفرة");
  }

  saveCart();
  renderCart();
}

function removeFromCart(productId){
  cart = cart.filter(item => String(item.id) !== String(productId));
  saveCart();
  renderCart();
}

function openCart(){
  document.getElementById("overlay").classList.add("show");
  document.getElementById("cartPanel").classList.add("open");
  renderCart();
}

function closeCart(){
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("cartPanel").classList.remove("open");
}

function showCustomerForm(){
  if(!cart.length){
    alert("السلة فارغة");
    return;
  }
  document.getElementById("customerForm").classList.add("show");
}

async function sendOrder(){
  if(!cart.length){
    alert("السلة فارغة");
    return;
  }

  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("customerAddress").value.trim();
  const note = document.getElementById("customerNote").value.trim();

  if(!name || !phone || !address){
    alert("يرجى تعبئة الاسم ورقم الهاتف والعنوان");
    return;
  }

  const orderItems = cart.map(item => ({
    id:item.id,
    name:item.name,
    price:Number(item.price || 0),
    quantity:Number(item.quantity || 0)
  }));

  const total = getCartTotal();

  const orderData = {
    customer_name:name,
    phone:phone,
    address:address,
    note:note,
    items:orderItems,
    total:total,
    created_at:new Date().toISOString()
  };

  const result = await supabaseClient
    .from("orders")
    .insert(orderData)
    .select()
    .single();

  if(result.error){
    console.error(result.error);
    alert("تعذر تسجيل الطلب:\n" + result.error.message);
    return;
  }

  let notesText = "";
  if(note) notesText += note;

  if(cart.length){
    const brief = cart.map(i => `${i.name} × ${i.quantity}`).join("، ");
    notesText = (notesText ? (notesText + "\n") : "") + `المنتجات: ${brief}`;
  }

  // ✅ رابط الدفع عربكس
  const PAYMENT_URL = "https://arabexkw.com/axpay.php?open=1&acc=96566771506";

  // ✅ مفاتيح بديلة لتعبئة الاسم/الهاتف/العنوان
  const paymentQuery =
    `&amount=${encodeURIComponent(total.toFixed(2))}` +
    `&cust_name=${encodeURIComponent(name)}` +
    `&cust_phone=${encodeURIComponent(phone)}` +
    `&cust_address=${encodeURIComponent(address)}` +
    `&notes=${encodeURIComponent(notesText || "")}`;

  const paymentUrl = PAYMENT_URL + paymentQuery;

  window.open(paymentUrl, "_blank");

  cart = [];
  saveCart();
  renderCart();

  document.getElementById("customerForm").classList.remove("show");
  document.getElementById("customerName").value = "";
  document.getElementById("customerPhone").value = "";
  document.getElementById("customerAddress").value = "";
  document.getElementById("customerNote").value = "";

  alert("تم تسجيل الطلب وفتح صفحة الدفع");
}

/* --- تشغيل التطبيق --- */
async function startApp(){
  loadCart();
  await loadAllData();

  renderSettings();
  renderCategories();

  renderCart();
}
startApp();
</script>
