<script>
const ADMIN_PASSWORD="1234";

const defaultSettings={

  brandName:"REFAEI",
  heroTitle:"REFAEI",

  aboutText:"نختار لكم المنتجات بعناية لنقدم منتجات تجمع بين الجودة والذوق والأصالة.",
  footer:"© 2025 REFAEI — جميع الحقوق محفوظة",
  whatsapp:"96500000000"
};

const defaultCategories=[
  {id:1,name:"أقمشة",image:""},
  {id:2,name:"شالات",image:""},
  {id:3,name:"مسابيح",image:""}
];

const defaultProducts=[
  {
    id:1,
    name:"قماش فاخر بني",
    category:"أقمشة",
    price:18,
    stock:10,
    description:"قماش فاخر بخامة ناعمة ومظهر أنيق.",
    image:""

let settings=

let categories=

  ||defaultCategories;

let products=
  JSON.parse(localStorage.getItem("refaeiProducts"))

let cart=
  JSON.parse(localStorage.getItem("refaeiCart"))

let purchaseReports=

  ||[];

function saveAll(){

  localStorage.setItem(
    "refaeiSettings",
    JSON.stringify(settings)
  );

  localStorage.setItem(
    "refaeiCategories",
    JSON.stringify(categories)
  );

  localStorage.setItem(
    "refaeiProducts",
    JSON.stringify(products)
  );

  localStorage.setItem(
    "refaeiCart",
    JSON.stringify(cart)
  );

  localStorage.setItem(
    "refaeiPurchaseReports",
    JSON.stringify(purchaseReports)
  );
}

function safe(text){

  return String(text??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* تحديد الإيموجي تلقائيًا حسب اسم القسم */

function getCategoryEmoji(categoryName){

  const name=String(categoryName||"")
    .trim()
    .toLowerCase();

  if(
    name.includes("قماش") ||
    name.includes("أقمشة") ||
    name.includes("نسيج") ||
    name.includes("ثوب") ||
    name.includes("ثياب")
  ){
    return "🧵";
  }

  if(
    name.includes("شال") ||
    name.includes("شالات") ||
    name.includes("كشمير") ||
    name.includes("كشميري") ||
    name.includes("وشاح")
  ){
    return "🧣";
  }

  if(
    name.includes("مسباح") ||
    name.includes("مسابيح") ||
    name.includes("سبحة") ||
    name.includes("سبح")
  ){
    return "📿";
  }

  if(
    name.includes("عطر") ||
    name.includes("عطور") ||
    name.includes("بخور") ||
    name.includes("روائح")
  ){
    return "🌹";
  }

  if(
    name.includes("ملابس") ||
    name.includes("ملبس") ||
    name.includes("أزياء")
  ){
    return "👕";
  }

  if(
    name.includes("عباية") ||
    name.includes("عبايات")
  ){
    return "🥻";
  }

  if(
    name.includes("حذاء") ||
    name.includes("أحذية") ||
    name.includes("جزمة") ||
    name.includes("جزم")
  ){
    return "👟";
  }

  if(
    name.includes("شنطة") ||
    name.includes("شنط") ||
    name.includes("حقيبة") ||
    name.includes("حقائب") ||
    name.includes("محفظة")
  ){
    return "👜";
  }

  if(
    name.includes("ذهب") ||
    name.includes("فضة") ||
    name.includes("مجوهرات") ||
    name.includes("خاتم") ||
    name.includes("خواتم")
  ){
    return "💎";
  }

  if(
    name.includes("ساعة") ||
    name.includes("ساعات")
  ){
    return "⌚";
  }

  if(
    name.includes("هدايا") ||
    name.includes("هدية")
  ){
    return "🎁";
  }

  if(
    name.includes("ورد") ||
    name.includes("زهور") ||
    name.includes("زهرة")
  ){
    return "🌸";
  }

  if(
    name.includes("قهوة") ||
    name.includes("بن")
  ){
    return "☕";
  }

  if(
    name.includes("حلويات") ||
    name.includes("حلوى") ||
    name.includes("كيك") ||
    name.includes("شكولاتة")
  ){
    return "🍰";
  }

  if(
    name.includes("كتب") ||
    name.includes("كتاب") ||
    name.includes("قرطاسية")
  ){
    return "📚";
  }

  if(
    name.includes("جوال") ||
    name.includes("هاتف") ||
    name.includes("هواتف") ||
    name.includes("إلكترونيات") ||
    name.includes("كمبيوتر")
  ){
    return "📱";
  }

  if(
    name.includes("ألعاب") ||
    name.includes("لعبة") ||
    name.includes("أطفال")
  ){
    return "🧸";
  }

  if(
    name.includes("رياضة") ||
    name.includes("تمارين") ||
    name.includes("كرة")
  ){
    return "⚽";
  }

  if(
    name.includes("منزل") ||
    name.includes("ديكور") ||
    name.includes("أثاث") ||
    name.includes("مفروشات")
  ){
    return "🏠";
  }

  return "🛍️";
}

function renderSettings(){

  topbarText.textContent=settings.topbar;
  brandName.textContent=settings.brandName;
  heroTitle.textContent=settings.heroTitle;
  heroDescription.textContent=settings.heroDescription;
  aboutTitle.textContent=settings.aboutTitle;
  aboutText.textContent=settings.aboutText;
  footerText.textContent=settings.footer;
}

function fillSettings(){

  settingTopbar.value=settings.topbar;
  settingBrandName.value=settings.brandName;
  settingHeroTitle.value=settings.heroTitle;
  settingHeroDescription.value=settings.heroDescription;
  settingAboutTitle.value=settings.aboutTitle;
  settingAboutText.value=settings.aboutText;
  settingFooter.value=settings.footer;
  settingWhatsapp.value=settings.whatsapp;
}

function saveSettings(event){

  event.preventDefault();

  settings={
    topbar:settingTopbar.value.trim(),
    brandName:settingBrandName.value.trim(),
    heroTitle:settingHeroTitle.value.trim(),
    heroDescription:settingHeroDescription.value.trim(),
    aboutTitle:settingAboutTitle.value.trim(),
    aboutText:settingAboutText.value.trim(),
    footer:settingFooter.value.trim(),
    whatsapp:settingWhatsapp.value.trim()
  };

  saveAll();
  renderSettings();

  alert("تم حفظ تعديلات المتجر");
}

function renderCategories(){

  categoriesList.innerHTML=categories.map(category=>{

    const image=category.image
      ?`<img src="${category.image}" alt="">`
      :`<div class="category-placeholder">
          ${getCategoryEmoji(category.name)}
        </div>`;

    const count=products.filter(
      product=>product.category===category.name
    ).length;

    return `
      <div class="category-card">

        ${image}

        <button onclick="filterProducts('${safe(category.name)}')">
          ${safe(category.name)}
        </button>

        <small>${count} منتجات</small>

      </div>
    `;
  }).join("");
}

function renderProducts(list=products){

  if(!list.length){

    productsGrid.innerHTML=
      "<p style='grid-column:1/-1;text-align:center'>لا توجد منتجات</p>";

    return;
  }

  productsGrid.innerHTML=list.map(product=>{

    const stock=Number(product.stock)||0;

    const image=product.image
      ?`<img src="${product.image}" alt="">`
      :"🛍️";

    return `
      <article class="product">

        <div class="product-img">

          ${image}

          <span class="stock-badge ${stock<=0?"out":""}">
            ${stock<=0?"نفد المخزون":"متبقي "+stock}
          </span>

        </div>

        <div class="product-info">

          <small>${safe(product.category)}</small>

          <h3>${safe(product.name)}</h3>

          <p>${safe(product.description)}</p>

          <div class="product-bottom">

            <span class="price">
              ${Number(product.price).toFixed(2)} د.ك
            </span>

            <button class="add-btn"
                    onclick="addToCart(${product.id})"
                    ${stock<=0?"disabled":""}>
              ${stock<=0?"غير متوفر":"إضافة للسلة"}
            </button>

          </div>

        </div>

      </article>
    `;
  }).join("");
}

function showShoppingContent(){

  document.querySelector(".categories-section")
    .classList.add("visible");

  document.querySelector(".products-section")
    .classList.add("visible");

  renderCategories();
  renderProducts();

  document.getElementById("categories")

function showStore(event){

  if(event){
    event.preventDefault();
  }

  storePage.classList.remove("hidden");
  adminPage.classList.remove("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function showCategoriesPage(event){

  event.preventDefault();

  storePage.classList.remove("hidden");
  adminPage.classList.remove("active");

  document.querySelector(".categories-section")
    .classList.add("visible");

  document.querySelector(".products-section")
    .classList.remove("visible");

  renderCategories();

  document.getElementById("categories")
    .scrollIntoView({
      behavior:"smooth"
    });
}

function showProductsPage(event){

  event.preventDefault();

  storePage.classList.remove("hidden");
  adminPage.classList.remove("active");

  document.querySelector(".categories-section")
    .classList.remove("visible");

  document.querySelector(".products-section")
    .classList.add("visible");

  document.getElementById("products")

function filterProducts(category){

  document.querySelector(".categories-section")
    .classList.remove("visible");

  document.querySelector(".products-section")
    .classList.add("visible");

  productsTitle.textContent=category;

  renderProducts(
    products.filter(
      product=>product.category===category
    )
  );

  document.getElementById("products")
    .scrollIntoView({
      behavior:"smooth"
    });
}

function showAllProducts(){

  document.querySelector(".categories-section")
    .classList.remove("visible");

  document.querySelector(".products-section")
    .classList.add("visible");

  productsTitle.textContent="جميع المنتجات";

  renderProducts();

  document.getElementById("products")
    .scrollIntoView({
      behavior:"smooth"
    });
}

function addToCart(id){

  const product=products.find(
    item=>item.id==id
  );

  if(!product||Number(product.stock)<=0){

    alert("المنتج غير متوفر");
    return;
  }

  const item=cart.find(
    item=>item.id==id
  );

  if(item){

    if(item.quantity>=Number(product.stock)){

      alert("لا توجد كمية إضافية متوفرة");
      return;
    }

    item.quantity++;

  }else{

    cart.push({
      id:product.id,
      name:product.name,
      price:Number(product.price),
      quantity:1
    });
  }

  saveAll();
  renderCart();
  openCart();
}

function increaseQuantity(id){

  const item=cart.find(
    item=>item.id==id
  );

  const product=products.find(
    item=>item.id==id
  );

  if(!item||!product){
    return;
  }

  if(item.quantity>=Number(product.stock)){

    alert("لا توجد كمية إضافية متوفرة");
    return;
  }

  item.quantity++;

  saveAll();
  renderCart();
}

function decreaseQuantity(id){

  const item=cart.find(
    item=>item.id==id
  );

  if(!item){
    return;
  }

  item.quantity--;

  if(item.quantity<=0){

    cart=cart.filter(
      item=>item.id!=id
    );
  }

  saveAll();
  renderCart();
}

function removeFromCart(id){

  cart=cart.filter(
    item=>item.id!=id
  );

  saveAll();
  renderCart();
}

function renderCart(){

  cartCount.textContent=cart.reduce(
    (sum,item)=>sum+Number(item.quantity||0),
    0
  );

  if(!cart.length){

    cartItems.innerHTML=
      "<p style='text-align:center;padding:30px;color:#927c6a'>السلة فارغة</p>";

    cartSummary.classList.add("hidden");
    return;
  }

  cartSummary.classList.remove("hidden");

  let total=0;

  cartItems.innerHTML=cart.map(item=>{

    const price=Number(item.price||0);
    const quantity=Number(item.quantity||0);
    const itemTotal=price*quantity;

    total+=itemTotal;

    return `
      <div class="cart-item">

        <div>

          <h4>${safe(item.name)}</h4>

          <p>
            سعر القطعة:
            ${price.toFixed(2)} د.ك
          </p>

          <div class="qty">

            <button onclick="increaseQuantity(${item.id})">
              +
            </button>

            <strong>${quantity}</strong>

            <button onclick="decreaseQuantity(${item.id})">
              −
            </button>

          </div>

          <button class="remove"
                  onclick="removeFromCart(${item.id})">
            حذف المنتج
          </button>

        </div>

        <strong>
          ${itemTotal.toFixed(2)} د.ك
        </strong>

      </div>
    `;
  }).join("");

  cartTotal.textContent=
    total.toFixed(2)+" د.ك";
}

function openCart(){

  cartPanel.classList.add("open");
  overlay.classList.add("show");

  renderCart();
}

function closeCart(){

  cartPanel.classList.remove("open");
  overlay.classList.remove("show");
}

function showCustomerForm(){

  customerForm.classList.add("show");
}

function sendOrder(){

  const name=customerName.value.trim();
  const phone=customerPhone.value.trim();
  const address=customerAddress.value.trim();
  const note=customerNote.value.trim();

  if(!name||!phone){

    alert("اكتب اسم العميل ورقم الهاتف");
    return;
  }

  if(!cart.length){

    alert("السلة فارغة");
    return;
  }

  let total=0;

  let message=
    "طلب جديد من متجر "+
    settings.brandName+
    "\n\n";

  message+="اسم العميل: "+name+"\n";
  message+="رقم الهاتف: "+phone+"\n";

  if(address){
    message+="العنوان: "+address+"\n";
  }

  if(note){
    message+="ملاحظات: "+note+"\n";
  }

  message+="\nالمنتجات:\n";

  const reportItems=[];

  for(const item of cart){

    const product=products.find(
      product=>product.id==item.id
    );

    if(!product){
      continue;
    }

    const quantity=Number(item.quantity);
    const price=Number(product.price);
    const itemTotal=quantity*price;

    total+=itemTotal;

    reportItems.push({
      name:product.name,
      quantity:quantity,
      price:price,
      total:itemTotal
    });

    message+=
      "- "+product.name+
      " | الكمية: "+quantity+
      " | السعر: "+price.toFixed(2)+
      " د.ك | الإجمالي: "+
      itemTotal.toFixed(2)+" د.ك\n";
  }

  message+=
    "\nالسعر النهائي: "+
    total.toFixed(2)+" د.ك\n";

  message+="التوصيل: يحدده البائع\n";

  purchaseReports.unshift({

    id:"RF-"+Date.now(),
    date:new Date().toLocaleString("ar-KW"),
    customerName:name,
    customerPhone:phone,
    address:address,
    note:note,
    items:reportItems,
    total:total
  });

  cart=[];

  saveAll();

  renderCart();
  renderProducts();
  renderCategories();
  renderAdminProducts();
  renderReports();
  updateSummary();

  window.open(
    "https://wa.me/"+
    settings.whatsapp+
    "?text="+encodeURIComponent(message),
    "_blank"
  );

  alert("تم إرسال الطلب بنجاح");

  closeCart();
}

function showAdmin(){

  storePage.classList.add("hidden");
  adminPage.classList.add("active");

  const logged=
    sessionStorage.getItem("refaeiAdmin")==="true";

  adminLogin.classList.toggle("hidden",logged);
  adminDashboard.classList.toggle("hidden",!logged);

  if(logged){

    fillSettings();
    renderCategorySelect();
    renderAdminCategories();
    renderAdminProducts();
    renderReports();

}

  if(adminPassword.value!==ADMIN_PASSWORD){

    loginNotice.textContent=
      "كلمة المرور غير صحيحة";

    loginNotice.classList.add("show");
    return;
  }

  sessionStorage.setItem(
    "refaeiAdmin",
    "true"
  );

  showAdmin();
}

function logoutAdmin(){

  sessionStorage.removeItem("refaeiAdmin");

  location.hash="";

  showStore();
}

function renderCategorySelect(){

  productCategory.innerHTML=
    "<option value=''>اختر القسم</option>"+
    categories.map(category=>
      `<option value="${safe(category.name)}">
        ${safe(category.name)}
      </option>`
    ).join("");
}

function renderAdminCategories(){

  adminCategoriesList.innerHTML=
    categories.map(category=>`

      <div class="category-admin-row">

        ${
          category.image
          ?`<img src="${category.image}" alt="">`
          :`<div class="category-admin-placeholder">
              ${getCategoryEmoji(category.name)}
            </div>`
        }

        <h3>${safe(category.name)}</h3>

        <div class="category-admin-actions">

          <button class="edit-btn"
                  onclick="editCategory(${category.id})">
            تعديل
          </button>

          <button class="delete-btn"
                  onclick="deleteCategory(${category.id})">
            حذف
          </button>

        </div>

      </div>
    `).join("");
}

function saveCategory(event){

  event.preventDefault();

  const id=editCategoryId.value;
  const name=categoryName.value.trim();

  if(!name){
    return;
  }

  if(id){

    const category=categories.find(
      item=>item.id==id
    );

    if(category){

      const oldName=category.name;

      category.name=name;

      products.forEach(product=>{

        if(product.category===oldName){
          product.category=name;
        }

      });
    }

  }else{

    categories.push({
      id:Date.now(),
      name:name,
      image:""
    });
  }

  saveAll();

  renderCategories();
  renderCategorySelect();
  renderAdminCategories();

  cancelCategoryEdit();

  alert("تم حفظ القسم");
}

function editCategory(id){

  const category=categories.find(
    item=>item.id==id
  );

  if(!category){
    return;
  }

  editCategoryId.value=category.id;
  categoryName.value=category.name;

  cancelCategoryBtn.classList.remove("hidden");
  categorySaveBtn.textContent="حفظ التعديل";
}

function cancelCategoryEdit(){

  editCategoryId.value="";
  categoryName.value="";

  cancelCategoryBtn.classList.add("hidden");
  categorySaveBtn.textContent="إضافة القسم";
}

function deleteCategory(id){

  const category=categories.find(
    item=>item.id==id
  );

  if(!category){
    return;
  }

  const used=products.some(
    product=>product.category===category.name
  );

  if(used){

    alert("احذف منتجات القسم أولًا");
    return;
  }

  categories=categories.filter(
    item=>item.id!=id
  );

  saveAll();

  renderCategories();
  renderCategorySelect();
  renderAdminCategories();
}

function saveProduct(event){

  event.preventDefault();

  const id=editProductId.value;

  const data={
    name:productName.value.trim(),
    category:productCategory.value,
    price:Number(productPrice.value),
    stock:Number(productStock.value),
    description:productDescription.value.trim()
  };

  if(id){

    const product=products.find(
      item=>item.id==id
    );

    if(product){
      Object.assign(product,data);
    }

  }else{

    products.unshift({
      id:Date.now(),
      ...data,
      image:""
    });
  }

  saveAll();

  renderProducts();
  renderCategories();
  renderAdminProducts();
  updateSummary();

  cancelProductEdit();

  alert("تم حفظ المنتج والسعر والكمية");
}

function editProduct(id){

  const product=products.find(
    item=>item.id==id
  );

  if(!product){
    return;
  }

  editProductId.value=product.id;
  productName.value=product.name;
  productCategory.value=product.category;
  productPrice.value=product.price;
  productStock.value=product.stock;
  productDescription.value=product.description;

  cancelProductBtn.classList.remove("hidden");
  productSaveBtn.textContent="حفظ تعديل المنتج";
}

function cancelProductEdit(){

  editProductId.value="";
  productName.value="";
  productCategory.value="";
  productPrice.value="";
  productStock.value="";
  productDescription.value="";

  cancelProductBtn.classList.add("hidden");
  productSaveBtn.textContent="إضافة المنتج";
}

function deleteProduct(id){

  if(!confirm("هل تريد حذف المنتج؟")){
    return;
  }

  products=products.filter(
    item=>item.id!=id
  );

  cart=cart.filter(
    item=>item.id!=id
  );

  saveAll();

  renderProducts();
  renderCategories();
  renderCart();
  renderAdminProducts();
  updateSummary();
}

function renderAdminProducts(){

  if(!products.length){

    adminProductsList.innerHTML=
      "<p>لا توجد منتجات</p>";

    return;
  }

  adminProductsList.innerHTML=
    products.map(product=>{

      const stock=Number(product.stock)||0;

      return `
        <div class="admin-row">

          <div class="admin-placeholder">
            🛍️
          </div>

          <div>

            <h3>${safe(product.name)}</h3>

            <p>
              القسم: ${safe(product.category)}
              <br>
              السعر:
              ${Number(product.price).toFixed(2)} د.ك
              <br>
              الكمية المتبقية:
              ${stock}
            </p>

          </div>

          <div class="admin-actions">

            <button class="edit-btn"
                    onclick="editProduct(${product.id})">
              تعديل السعر والكمية
            </button>

            <button class="delete-btn"
                    onclick="deleteProduct(${product.id})">
              حذف
            </button>

          </div>

        </div>
      `;
    }).join("");
}

function updateSummary(){

  totalProductsCount.textContent=
    products.length;

  totalStockCount.textContent=
    products.reduce(
      (sum,product)=>
        sum+Number(product.stock||0),
      0
    );

  totalOrdersCount.textContent=
    purchaseReports.length;
}

function renderReports(){

  if(!purchaseReports.length){

    purchaseReportsList.innerHTML=`
      <tr>
        <td colspan="5"
            style="text-align:center;padding:20px">
          لا توجد طلبات حتى الآن
        </td>
      </tr>
    `;

    return;
  }

  purchaseReportsList.innerHTML=
    purchaseReports.map(order=>{

      const items=order.items.map(item=>
        `${safe(item.name)} × ${item.quantity}`
      ).join("<br>");

      return `
        <tr>

          <td>${safe(order.date)}</td>

          <td>${safe(order.customerName)}</td>

          <td>${safe(order.customerPhone)}</td>

          <td>${items}</td>

          <td>
            ${Number(order.total||0).toFixed(2)}
            د.ك
          </td>

        </tr>
      `;
    }).join("");
}

function checkPage(){

  if(location.hash==="#admin"){
    showAdmin();
  }else{
    showStore();
  }
}

window.addEventListener(
  "hashchange",
  checkPage
);

renderSettings();
renderCategories();
renderProducts();
renderCart();
checkPage();
</script>
