function byId(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function saveLocalData(){
  localStorage.setItem(
    "refaeiCategories",
    JSON.stringify(categories)
  );

  localStorage.setItem(
    "refaeiCart",
    JSON.stringify(cart)
  );

  localStorage.setItem(
    "refaeiReports",
    JSON.stringify(reports)
  );
}

function normalizeProduct(product){
  return {
    id:product.id,
    name:product.name || "",
    description:product.description || "",
    price:Number(product.price || 0),
    image_url:product.image_url || "",
    category:product.category || "",
    stock:Number(product.stock || 0),
    is_active:product.is_active !== false,
    created_at:product.created_at || ""
  };
}

async function loadProducts(){
  const {data,error} = await supabaseClient
    .from("products")
    .select("*")
    .eq("is_active",true)
    .order("created_at",{ascending:false});

  if(error){
    console.error("Load products error:",error);
    products=[];
    showProductsError("تعذر تحميل المنتجات من قاعدة البيانات");
    return;
  }

  products=(data || []).map(normalizeProduct);

  renderCategories();
  renderProducts();
  renderAdminProducts();
  renderCategoryOptions();
  updateCartAfterProductsLoad();
}

function showProductsError(message){
  const box=byId("productsGrid");

  if(box){
    box.innerHTML=`
      <p style="grid-column:1/-1;text-align:center;color:#bd3d36">
        ${escapeHTML(message)}
      </p>
    `;
  }
}

function updateCartAfterProductsLoad(){
  cart=cart.filter(item=>
    products.some(product=>
      product.id===item.productId &&
      Number(product.stock)>0
    )
  );

  cart.forEach(item=>{
    const product=products.find(
      product=>product.id===item.productId
    );

    if(product &&
       Number(item.quantity)>Number(product.stock)){
      item.quantity=Number(product.stock);
    }
  });

  saveLocalData();
  updateCartCount();
  renderCart();
}

function renderCategories(){
  const box=byId("categoriesList");

  if(!box) return;

  box.innerHTML=categories.map(category=>{
    const count=products.filter(product=>
      product.category===category.name
    ).length;

    return `
      <div class="category-card">
        <div class="category-placeholder">✦</div>

        <button type="button"
          onclick="filterProducts('${category.id}')">
          ${escapeHTML(category.name)}
        </button>

        <small>${count} منتج</small>
      </div>
    `;
  }).join("");
}

function filterProducts(categoryId){
  const category=categories.find(
    item=>item.id===categoryId
  );

  byId("categories").classList.add("visible");
  byId("products").classList.add("visible");

  byId("productsTitle").textContent=
    category ? category.name : "المنتجات";

  renderProducts(category ? category.name : "");

  byId("products").scrollIntoView({
    behavior:"smooth"
  });
}

function renderProducts(categoryName=null){
  const box=byId("productsGrid");
  if(!box) return;

  const list=categoryName
    ? products.filter(product=>
        product.category===categoryName
      )
    : products;

  if(!list.length){
    box.innerHTML=`
      <p style="grid-column:1/-1;text-align:center;color:#927c6a">
        لا توجد منتجات حالياً
      </p>
    `;
    return;
  }

  box.innerHTML=list.map(product=>{
    const out=Number(product.stock)<=0;

    const image=product.image_url
      ? `<img src="${escapeHTML(product.image_url)}"
          alt="${escapeHTML(product.name)}">`
      : "🛍️";

    return `
      <article class="product">
        <div class="product-img">
          ${image}

          <span class="stock-badge ${out ? "out" : ""}">
            ${
              out
                ? "غير متوفر"
                : `متوفر: ${Number(product.stock)}`
            }
          </span>
        </div>

        <div class="product-info">
          <small>${escapeHTML(product.category)}</small>

          <h3>${escapeHTML(product.name)}</h3>

          <p>${escapeHTML(product.description)}</p>

          <div class="product-bottom">
            <span class="price">
              ${Number(product.price).toFixed(2)} د.ك
            </span>

            <button class="add-btn"
              ${out ? "disabled" : ""}
              onclick="addToCart('${product.id}')">
              ${out ? "غير متوفر" : "أضف للسلة"}
            </button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function addToCart(productId){
  const product=products.find(
    item=>item.id===productId
  );

  if(!product || Number(product.stock)<=0){
    alert("المنتج غير متوفر");
    return;
  }

  const existing=cart.find(
    item=>item.productId===productId
  );

  if(existing){
    if(Number(existing.quantity)>=Number(product.stock)){
      alert("لا توجد كمية إضافية متوفرة");
      return;
    }

    existing.quantity++;
  }else{
    cart.push({
      productId,
      quantity:1
    });
  }

  saveLocalData();
  updateCartCount();
  renderCart();
  openCart();
}

function updateCartCount(){
  const count=cart.reduce(
    (total,item)=>
      total+Number(item.quantity || 0),
    0
  );

  byId("cartCount").textContent=count;
}

function openCart(){
  byId("overlay").classList.add("show");
  byId("cartPanel").classList.add("open");
  renderCart();
}

function closeCart(){
  byId("overlay").classList.remove("show");
  byId("cartPanel").classList.remove("open");
}
<script>
function renderCart(){
  const box=byId("cartItems");
  const summary=byId("cartSummary");

  if(!cart.length){
    box.innerHTML=`
      <p style="text-align:center;padding:30px;color:#927c6a">
        السلة فارغة
      </p>
    `;

    summary.classList.add("hidden");
    return;
  }

  let total=0;

  box.innerHTML=cart.map(item=>{
    const product=products.find(
      product=>product.id===item.productId
    );

    if(!product) return "";

    const quantity=Number(item.quantity || 0);
    const itemTotal=Number(product.price)*quantity;

    total+=itemTotal;

    return `
      <div class="cart-item">
        <div>
          <h4>${escapeHTML(product.name)}</h4>

          <p>
            سعر القطعة:
            ${Number(product.price).toFixed(2)} د.ك
          </p>

          <div class="qty">
            <button onclick="changeQuantity('${product.id}',1)">
              +
            </button>

            <strong>${quantity}</strong>

            <button onclick="changeQuantity('${product.id}',-1)">
              −
            </button>
          </div>

          <button class="remove"
            onclick="removeFromCart('${product.id}')">
            حذف المنتج
          </button>
        </div>

        <strong>${itemTotal.toFixed(2)} د.ك</strong>
      </div>
    `;
  }).join("");

  byId("cartTotal").textContent=
    `${total.toFixed(2)} د.ك`;

  summary.classList.remove("hidden");
}

function changeQuantity(productId,amount){
  const item=cart.find(
    cartItem=>cartItem.productId===productId
  );

  const product=products.find(
    product=>product.id===productId
  );

  if(!item || !product) return;

  item.quantity=Number(item.quantity)+amount;

  if(item.quantity<=0){
    cart=cart.filter(
      cartItem=>cartItem.productId!==productId
    );
  }else if(item.quantity>Number(product.stock)){
    item.quantity=Number(product.stock);
  }

  saveLocalData();
  updateCartCount();
  renderCart();
}

function removeFromCart(productId){
  cart=cart.filter(
    item=>item.productId!==productId
  );

  saveLocalData();
  updateCartCount();
  renderCart();
}

function showCustomerForm(){
  if(!cart.length){
    alert("السلة فارغة");
    return;
  }

  byId("customerForm").classList.add("show");
}

async function sendOrder(){
  if(!cart.length){
    alert("السلة فارغة");
    return;
  }

  const name=byId("customerName").value.trim();
  const phone=byId("customerPhone").value.trim();
  const address=byId("customerAddress").value.trim();
  const note=byId("customerNote").value.trim();

  if(!name || !phone || !address){
    alert("يرجى تعبئة الاسم ورقم الهاتف والعنوان");
    return;
  }

  let total=0;
  let message=
    `طلب جديد من متجر REFAEI\n\n`+
    `الاسم: ${name}\n`+
    `الهاتف: ${phone}\n`+
    `العنوان: ${address}\n`+
    `ملاحظات: ${note}\n\n`+
    `المنتجات:\n`;

  const orderItems=[];
  const stockUpdates=[];

  for(const item of cart){
    const product=products.find(
      product=>product.id===item.productId
    );

    if(!product) continue;

    const quantity=Number(item.quantity);
    const price=Number(product.price);
    const itemTotal=quantity*price;

    total+=itemTotal;

    orderItems.push({
      name:product.name,
      quantity,
      price,
      total:itemTotal
    });

    message+=
      `- ${product.name} | الكمية: ${quantity} | `+
      `الإجمالي: ${itemTotal.toFixed(2)} د.ك\n`;

    stockUpdates.push({
      id:product.id,
      stock:Math.max(
        0,
        Number(product.stock)-quantity
      )
    });
  }

  message+=
    `\nالسعر النهائي: ${total.toFixed(2)} د.ك`;

  for(const update of stockUpdates){
    const {error}=await supabaseClient
      .from("products")
      .update({stock:update.stock})
      .eq("id",update.id);

    if(error){
      console.error("Stock update error:",error);
      alert("تعذر تحديث كمية أحد المنتجات");
      await loadProducts();
      return;
    }
  }

  reports.push({
    date:new Date().toLocaleString("ar-KW"),
    name,
    phone,
    address,
    note,
    items:orderItems,
    total
  });

  saveLocalData();

  window.open(
    `https://wa.me/${WHATSAPP_NUMBER}?text=${
      encodeURIComponent(message)
    }`,
    "_blank"
  );

  cart=[];

  byId("customerName").value="";
  byId("customerPhone").value="";
  byId("customerAddress").value="";
  byId("customerNote").value="";

  byId("customerForm").classList.remove("show");

  saveLocalData();
  updateCartCount();
  renderCart();
  closeCart();

  await loadProducts();
}

async function loginAdmin(){
  const email=byId("adminEmail").value.trim();
  const password=byId("adminPassword").value;
  const notice=byId("loginNotice");

  notice.textContent="";

  if(!email || !password){
    notice.textContent=
      "اكتب البريد الإلكتروني وكلمة المرور";
    return;
  }

  const result=
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(result.error){
    notice.textContent=
      "البريد الإلكتروني أو كلمة المرور غير صحيحة";
    return;
  }

  if(
    !result.data.user ||
    result.data.user.id!==ADMIN_USER_ID
  ){
    await supabaseClient.auth.signOut();

    notice.textContent=
      "هذا الحساب غير مصرح له بالدخول";
    return;
  }

  byId("adminLogin").classList.add("hidden");
  byId("adminDashboard").classList.remove("hidden");

  await loadProducts();
  renderAdmin();
}

async function checkAdminSession(){
  const result=
    await supabaseClient.auth.getSession();

  const user=result.data.session?.user;

  if(user && user.id===ADMIN_USER_ID){
    byId("adminLogin").classList.add("hidden");
    byId("adminDashboard").classList.remove("hidden");

    await loadProducts();
    renderAdmin();
  }else{
    byId("adminLogin").classList.remove("hidden");
    byId("adminDashboard").classList.add("hidden");
  }
}

function saveCategory(event){
  event.preventDefault();

  const id=byId("editCategoryId").value;
  const name=byId("categoryName").value.trim();

  if(!name){
    alert("اكتب اسم القسم");
    return;
  }

  if(id){
    const category=categories.find(
      item=>item.id===id
    );

    if(category){
      const oldName=category.name;
      category.name=name;

      products
        .filter(product=>product.category===oldName)
        .forEach(product=>{
          product.category=name;
        });
    }
  }else{
    categories.push({
      id:"cat-"+Date.now(),
      name
    });
  }

  saveLocalData();
  cancelCategoryEdit();
  renderAdmin();
  renderCategories();
  renderProducts();
}

function editCategory(id){
  const category=categories.find(
    item=>item.id===id
  );

  if(!category) return;

  byId("editCategoryId").value=category.id;
  byId("categoryName").value=category.name;
  byId("categorySaveBtn").textContent="حفظ التعديل";
  byId("cancelCategoryBtn").classList.remove("hidden");
}

function cancelCategoryEdit(){
  byId("editCategoryId").value="";
  byId("categoryName").value="";
  byId("categorySaveBtn").textContent="إضافة القسم";
  byId("cancelCategoryBtn").classList.add("hidden");
}

function deleteCategory(id){
  const category=categories.find(
    item=>item.id===id
  );

  if(!category) return;

  const used=products.some(product=>
    product.category===category.name
  );

  if(used){
    alert("لا يمكن حذف قسم يحتوي على منتجات");
    return;
  }

  if(!confirm("هل تريد حذف القسم؟")) return;

  categories=categories.filter(
    item=>item.id!==id
  );

  saveLocalData();
  renderAdmin();
  renderCategories();
}
<script>
async function uploadProductImage(file){
  if(!file) return "";

  const extension=
    file.name.split(".").pop().toLowerCase();

  const fileName=
    `${Date.now()}-${Math.random()
      .toString(36)
      .slice(2)}.${extension}`;

  const {error:uploadError}=
    await supabaseClient.storage
      .from(IMAGE_BUCKET)
      .upload(fileName,file,{
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      });

  if(uploadError){
    console.error("Image upload error:",uploadError);
    throw new Error(
      "تعذر رفع الصورة. تأكد من صلاحيات Storage."
    );
  }

  const {data}=supabaseClient.storage
    .from(IMAGE_BUCKET)
    .getPublicUrl(fileName);

  return data.publicUrl;
}

async function saveProduct(event){
  event.preventDefault();

  const id=byId("editProductId").value;
  const name=byId("productName").value.trim();
  const category=byId("productCategory").value;
  const price=Number(byId("productPrice").value);
  const stock=Number(byId("productStock").value);
  const description=
    byId("productDescription").value.trim();
  const file=byId("productImage").files[0];

  if(
    !name ||
    !category ||
    !description ||
    price<0 ||
    stock<0
  ){
    alert("يرجى تعبئة جميع بيانات المنتج");
    return;
  }

  const oldProduct=products.find(
    product=>product.id===id
  );

  const saveButton=byId("productSaveBtn");
  saveButton.disabled=true;
  saveButton.textContent="جاري الحفظ...";

  try{
    let image_url=oldProduct?.image_url || "";

    if(file){
      image_url=await uploadProductImage(file);
    }

    const payload={
      name,
      category,
      price,
      stock,
      description,
      image_url,
      is_active:true
    };

    let result;

    if(id){
      result=await supabaseClient
        .from("products")
        .update(payload)
        .eq("id",id)
        .select()
        .single();
    }else{
      result=await supabaseClient
        .from("products")
        .insert(payload)
        .select()
        .single();
    }

    if(result.error){
      console.error("Save product error:",result.error);
      throw new Error(
        "تعذر حفظ المنتج في قاعدة البيانات"
      );
    }

    alert(id ? "تم تعديل المنتج بنجاح" : "تمت إضافة المنتج بنجاح");

    cancelProductEdit();
    await loadProducts();
    renderAdmin();
  }catch(error){
    console.error(error);
    alert(error.message || "حدث خطأ أثناء حفظ المنتج");
  }finally{
    saveButton.disabled=false;
    saveButton.textContent=id
      ? "حفظ التعديل"
      : "إضافة المنتج";
  }
}

function editProduct(id){
  const product=products.find(
    item=>item.id===id
  );

  if(!product) return;

  byId("editProductId").value=product.id;
  byId("productName").value=product.name;
  byId("productCategory").value=product.category;
  byId("productPrice").value=product.price;
  byId("productStock").value=product.stock;
  byId("productDescription").value=
    product.description || "";

  const preview=byId("productImagePreview");

  if(product.image_url){
    preview.src=product.image_url;
    preview.style.display="block";
  }else{
    preview.style.display="none";
  }

  byId("productSaveBtn").textContent="حفظ التعديل";
  byId("cancelProductBtn").classList.remove("hidden");
}

function cancelProductEdit(){
  byId("editProductId").value="";
  byId("productName").value="";
  byId("productPrice").value="";
  byId("productStock").value="";
  byId("productDescription").value="";
  byId("productImage").value="";

  byId("productImagePreview").style.display="none";

  byId("productSaveBtn").textContent="إضافة المنتج";
  byId("cancelProductBtn").classList.add("hidden");
}

async function deleteProduct(id){
  if(!confirm("هل تريد حذف المنتج؟")) return;

  const {error}=await supabaseClient
    .from("products")
    .update({is_active:false})
    .eq("id",id);

  if(error){
    console.error("Delete product error:",error);
    alert("تعذر حذف المنتج");
    return;
  }

  cart=cart.filter(
    item=>item.productId!==id
  );

  saveLocalData();

  alert("تم حذف المنتج");
  await loadProducts();
  renderAdmin();
  renderCart();
  updateCartCount();
}

function renderReports(){
  const summary=byId("reportsSummary");
  const body=byId("reportsTableBody");

  if(!summary || !body) return;

  const totalOrders=reports.length;

  const totalSales=reports.reduce(
    (sum,report)=>
      sum+Number(report.total || 0),
    0
  );

  const totalItems=reports.reduce(
    (sum,report)=>
      sum+
      (report.items || []).reduce(
        (itemSum,item)=>
          itemSum+Number(item.quantity || 0),
        0
      ),
    0
  );

  summary.innerHTML=`
    <div class="report-stat">
      <strong>عدد الطلبات</strong>
      <span>${totalOrders}</span>
    </div>

    <div class="report-stat">
      <strong>إجمالي المبيعات</strong>
      <span>${totalSales.toFixed(2)}</span>
    </div>

    <div class="report-stat">
      <strong>عدد المنتجات المباعة</strong>
      <span>${totalItems}</span>
    </div>
  `;

  body.innerHTML=reports.slice().reverse().map(report=>`
    <tr>
      <td>${escapeHTML(report.date || "")}</td>
      <td>${escapeHTML(report.name || "")}</td>
      <td>${escapeHTML(report.phone || "")}</td>
      <td>${escapeHTML(report.address || "")}</td>

      <td>
        ${(report.items || []).map(item=>`
          ${escapeHTML(item.name)} × ${item.quantity}
        `).join("<br>")}
      </td>

      <td>
        ${Number(report.total || 0).toFixed(2)} د.ك
      </td>
    </tr>
  `).join("");
}

function clearReports(){
  if(!confirm("هل تريد مسح جميع التقارير؟")) return;

  reports=[];
  saveLocalData();
  renderReports();
}

function exportReportsToExcel(){
  if(!reports.length){
    alert("لا توجد تقارير للتصدير");
    return;
  }

  let csv=
    "التاريخ,العميل,الهاتف,العنوان,المنتجات,الإجمالي\n";

  reports.forEach(report=>{
    const items=(report.items || [])
      .map(item=>
        `${item.name} × ${item.quantity}`
      )
      .join(" | ");

    const row=[
      report.date,
      report.name,
      report.phone,
      report.address,
      items,
      Number(report.total || 0).toFixed(2)
    ];

    csv+=row.map(value=>
      `"${String(value || "")
        .replace(/"/g,'""')}"`
    ).join(",")+"\n";
  });

  const blob=new Blob(
    ["\ufeff"+csv],
    {type:"text/csv;charset=utf-8;"}
  );

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=url;
  link.download="refaei-reports.csv";
  document.body.appendChild(link);
  link.click();
  link.remove();

  URL.revokeObjectURL(url);
}

function initialize(){
  byId("brandName").textContent=settings.brand;
  byId("topbarText").textContent=settings.topbar;
  byId("heroTitle").textContent=settings.heroTitle;
  byId("heroDescription").textContent=
    settings.heroDescription;
  byId("aboutTitle").textContent=settings.aboutTitle;
  byId("aboutText").textContent=settings.aboutText;
  byId("footerText").textContent=settings.footer;

  renderCategories();
  renderCart();
  updateCartCount();

  byId("productImage").addEventListener(
    "change",
    function(){
      const file=this.files[0];
      const preview=byId("productImagePreview");

      if(!file){
        preview.style.display="none";
        return;
      }

      const reader=new FileReader();

      reader.onload=function(event){
        preview.src=event.target.result;
        preview.style.display="block";
      };

      reader.readAsDataURL(file);
    }
  );

  supabaseClient.auth.onAuthStateChange(
    function(){
      if(
        location.hash==="#admin" ||
        byId("adminPage").classList.contains("active")
      ){
        checkAdminSession();
      }
    }
  );

  loadProducts();

  if(location.hash==="#admin"){
    showAdmin();
  }
}

initialize();
