<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة - REFAEI</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      background:#14110c;
      color:#f5efe4;
      font-family:'Cairo',Tahoma,Arial,sans-serif;
      overflow-x:hidden;
      line-height:1.8;
    }
    .container{ width:min(1200px,92%); margin:auto; padding:22px 0 60px; }
    .hidden{ display:none!important; }

    .header{
      position:sticky; top:0; z-index:20;
      background:rgba(20,17,12,.85);
      border-bottom:1px solid rgba(255,255,255,.06);
      backdrop-filter:blur(18px);
      padding:14px 0;
    }
    .nav{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .brand{ display:flex; align-items:center; gap:12px; }
    .brand-mark{
      width:44px; height:44px; border-radius:50%;
      border:1px solid rgba(184,149,87,.65);
      display:grid; place-items:center;
      background:radial-gradient(circle,#fff8e9 0 55%,transparent 56%), #2b160d;
      color:#d7bd86; font-size:22px;
    }
    .brand-name{
      font-family:'Playfair Display',Georgia,serif;
      font-weight:800; font-size:22px; letter-spacing:3px;
      color:#f7ead7;
    }

    .card{
      background:rgba(255,253,249,.06);
      border:1px solid rgba(255,255,255,.08);
      border-radius:10px;
      padding:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
    }
    .section-title{
      font-family:'Playfair Display',Georgia,serif;
      font-size:22px;
      font-weight:900;
      margin-bottom:12px;
      color:#f7ead7;
    }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:900px){ .grid{ grid-template-columns:1fr; } }

    .field{ display:flex; flex-direction:column; gap:6px; margin:10px 0; }
    .field label{ font-size:13px; color:#cbbca8; font-weight:700; }
    input, textarea, select{
      width:100%;
      padding:11px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.25);
      color:#f5efe4;
      outline:none;
    }
    textarea{ resize:vertical; min-height:90px; }

    .btn{
      border:0;
      background:#2b160d;
      color:#fff;
      padding:10px 14px;
      border-radius:8px;
      cursor:pointer;
      transition:.2s ease;
      font-weight:800;
    }
    .btn:hover{ background:#b89557; transform:translateY(-2px); }
    .btn-secondary{
      background:transparent;
      border:1px solid rgba(255,255,255,.16);
    }
    .btn-secondary:hover{ background:rgba(255,255,255,.08); transform:none; }

    .toast{
      padding:12px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:#f5efe4;
    }
    .toast.ok{ border-color:rgba(25,135,84,.35); background:rgba(25,135,84,.12); }
    .toast.err{ border-color:rgba(184,56,56,.35); background:rgba(184,56,56,.12); }

    table{
      width:100%;
      border-collapse:collapse;
      border:1px solid rgba(255,255,255,.10);
      border-radius:10px;
      overflow:hidden;
      background:rgba(255,253,249,.04);
      margin-top:10px;
    }
    th, td{
      padding:12px 10px;
      border-bottom:1px solid rgba(255,255,255,.07);
      font-size:13px;
      vertical-align:top;
    }
    th{ color:#f7ead7; font-weight:900; background:rgba(184,149,87,.08); }

    .row-actions{ display:flex; gap:10px; flex-wrap:wrap; }
    .badge{
      display:inline-flex;
      align-items:center;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      background:rgba(184,149,87,.14);
      border:1px solid rgba(184,149,87,.3);
      color:#f7ead7;
    }
    .badge.red{
      background:rgba(184,56,56,.15);
      border-color:rgba(184,56,56,.35);
      color:#ffd1d1;
    }

    .img-preview{
      border:1px dashed rgba(255,255,255,.18);
      background:rgba(0,0,0,.20);
      border-radius:8px;
      padding:10px;
      text-align:center;
      color:#cbbca8;
      font-size:12px;
      margin-top:8px;
    }
    .img-preview img{ max-width:100%; height:auto; display:block; margin:0 auto 8px; }
  </style>
</head>

<body>
<header class="header">
  <div class="container nav">
    <div class="brand">
      <span class="brand-mark">𓅃</span>
      <span class="brand-name">REFAEI - الإدارة</span>
    </div>
    <div>
      <button id="logoutBtn" class="btn btn-secondary hidden" type="button" onclick="window.logout()">تسجيل خروج</button>
    </div>
  </div>
</header>

<!-- ✅ Hidden fixed upload input (fix for chooser activation) -->
<input id="adminImageUpload" type="file" accept="image/*" class="hidden" />

<main class="container">
  <!-- LOGIN -->
  <section id="loginView" class="card">
    <h2 class="section-title">تسجيل دخول الإدارة</h2>
    <div id="loginToast" class="toast err hidden"></div>

    <div class="grid">
      <div>
        <div class="field">
          <label>الإيميل</label>
          <input id="adminEmail" placeholder="اكتب الإيميل" autocomplete="email" />
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input id="adminPassword" type="password" placeholder="اكتب كلمة المرور" autocomplete="current-password" />
        </div>
        <div style="margin-top:12px;">
          <button class="btn" type="button" onclick="window.loginAdmin()">دخول</button>
        </div>
      </div>
      <div></div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="adminView" class="hidden">
    <div class="toast ok" id="adminWelcome" style="margin-bottom:14px;">مرحبًا</div>

    <div class="card">
      <h2 class="section-title">إعدادات الموقع</h2>
      <div class="grid">
        <div>
          <div class="field"><label>Topbar</label><textarea id="st_topbar"></textarea></div>
          <div class="field"><label>Brand Name</label><input id="st_brand_name" /></div>
          <div class="field"><label>Hero Title</label><input id="st_hero_title" /></div>
          <div class="field"><label>Hero Description</label><textarea id="st_hero_description"></textarea></div>
        </div>
        <div>
          <div class="field"><label>About Title</label><input id="st_about_title" /></div>
          <div class="field"><label>About Text</label><textarea id="st_about_text"></textarea></div>
          <div class="field"><label>Footer</label><textarea id="st_footer"></textarea></div>
          <div class="field"><label>WhatsApp (رقم)</label><input id="st_whatsapp" /></div>
          <div style="margin-top:12px;">
            <button class="btn" type="button" onclick="window.saveSiteSettings()">حفظ الإعدادات</button>
          </div>
        </div>
      </div>
    </div>

    <div style="height:16px;"></div>

    <div class="card">
      <h2 class="section-title">الأقسام</h2>
      <div class="grid">
        <div>
          <div class="field">
            <label>اسم القسم</label>
            <input id="cat_name" placeholder="مثال: قماش / شال / مسابيح" />
          </div>
          <div class="row-actions">
            <button class="btn" type="button" onclick="window.createCategory()">إضافة قسم</button>
          </div>
        </div>
        <div>
          <table>
            <thead>
              <tr>
                <th>الاسم</th>
                <th style="width:240px;">إجراءات</th>
              </tr>
            </thead>
            <tbody id="categoriesTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div style="height:16px;"></div>

    <div class="card">
      <h2 class="section-title">المنتجات</h2>
      <div class="grid">
        <div>
          <div class="field"><label>اسم المنتج</label><input id="p_name" /></div>

          <!-- ✅ dropdown categories -->
          <div class="field">
            <label>القسم (category)</label>
            <select id="p_category"></select>
            <div style="font-size:12px;color:#cbbca8;margin-top:6px;">
              اختر من الأقسام المتوفرة.
            </div>
          </div>

          <div class="field"><label>وصف المنتج</label><textarea id="p_description"></textarea></div>
          <div class="field"><label>السعر (دينار)</label><input id="p_price" type="number" step="0.01" /></div>
          <div class="field"><label>الكمية (stock)</label><input id="p_stock" type="number" step="1" /></div>

          <div class="field">
            <label>صورة المنتج (رفع)</label>
            <button class="btn btn-secondary" type="button" onclick="window.openUploadFromUI('create')">اختيار صورة</button>
            <div id="p_image_preview" class="img-preview">لم يتم اختيار صورة</div>
            <div style="margin-top:10px;font-size:12px;color:#cbbca8;">
              (اختياري) بعد الإضافة لو رفعت صورة سنستخدمها.
            </div>
          </div>

          <div class="row-actions">
            <button class="btn" type="button" onclick="window.createProduct()">إضافة منتج</button>
          </div>
        </div>

        <div>
          <table>
            <thead>
              <tr>
                <th>المنتج</th>
                <th>القسم</th>
                <th>السعر</th>
                <th>Stock</th>
                <th style="width:240px;">إجراءات</th>
              </tr>
            </thead>
            <tbody id="productsTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div style="height:16px;"></div>

    <div class="card">
      <h2 class="section-title">طلبات العملاء</h2>
      <table>
        <thead>
          <tr>
            <th>العميل</th>
            <th>الطلبات</th>
            <th>الإجمالي</th>
            <th>تاريخ</th>
            <th>حذف</th>
          </tr>
        </thead>
        <tbody id="ordersTbody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
/** ====== CONFIG ====== **/
const SUPABASE_URL = "https://mvsdblzjzrscnfgiqxan.supabase.co";
const SUPABASE_KEY = "sb_publishable_KWMjd7EDbWtH2Ay7TdJwZg_s2et1Hc7";

// ✅ from your bucket screenshot
const STORAGE_BUCKET = "product-images";
const STORAGE_FOLDER = "products";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function $(id){ return document.getElementById(id); }

function escapeHtml(str){
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function setToast(el, msg, type="err"){
  el.textContent = msg;
  el.classList.remove("hidden");
  el.classList.toggle("ok", type==="ok");
  el.classList.toggle("err", type==="err");
}

/** ====== Storage upload helpers ====== **/
let pendingUploadMode = null; // "create" | "edit"
let pendingEditId = null;
let pendingUploadFile = null;

function getExt(fileName){
  const idx = fileName.lastIndexOf(".");
  return idx >= 0 ? fileName.slice(idx+1).toLowerCase() : "jpg";
}

async function uploadImageFile(file, objectBaseName){
  const ext = getExt(file.name);
  const filePath = `${STORAGE_FOLDER}/${objectBaseName}.${ext}`;

  const res = await supabaseClient.storage
    .from(STORAGE_BUCKET)
    .upload(filePath, file, { upsert:true });

  if(res.error) throw res.error;

  // bucket is PUBLIC (based on your screenshot)
  const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(filePath);
  return data?.publicUrl || null;
}

/** ====== Preview for fixed upload input ====== **/
function previewSelectedFile(file){
  const preview = $("p_image_preview");
  if(!preview) return;
  if(!file){
    preview.textContent = "لم يتم اختيار صورة";
    return;
  }
  const url = URL.createObjectURL(file);
  preview.innerHTML = `<img src="${url}" alt="preview" /> تم اختيار: ${escapeHtml(file.name)}`;
}

/** open upload from UI with user activation */
window.openUploadFromUI = function(mode, editId=null){
  pendingUploadMode = mode;
  pendingEditId = editId;

  const input = $("adminImageUpload");
  input.value = "";
  pendingUploadFile = null;

  input.onchange = () => {
    const file = input.files?.[0] || null;
    pendingUploadFile = file;
    previewSelectedFile(file);
  };

  input.click();
};

/** ====== RPC Admin ====== **/
async function isAdminByRPC(){
  const { data, error } = await supabaseClient.rpc("admin_get_self");
  if(error) throw error;
  return Array.isArray(data) ? data.length > 0 : !!data;
}

/** ====== Login ====== **/
window.loginAdmin = async function(){
  const email = $("adminEmail").value.trim();
  const password = $("adminPassword").value;

  const toast = $("loginToast");
  toast.classList.add("hidden");

  if(!email) { setToast(toast, "أدخل الإيميل", "err"); toast.classList.remove("hidden"); return; }
  if(!password) { setToast(toast, "أدخل كلمة المرور", "err"); toast.classList.remove("hidden"); return; }

  const signInRes = await supabaseClient.auth.signInWithPassword({ email, password });
  if(signInRes.error){
    setToast(toast, "بيانات الدخول غير صحيحة: " + signInRes.error.message, "err");
    toast.classList.remove("hidden");
    return;
  }

  try{
    const ok = await isAdminByRPC();
    if(!ok){
      setToast(toast, "غير مصرح لك بدخول لوحة الإدارة", "err");
      toast.classList.remove("hidden");
      return;
    }
  }catch(e){
    console.error(e);
    setToast(toast, "خطأ بالصلاحيات (RPC): " + (e?.message || e), "err");
    toast.classList.remove("hidden");
    return;
  }

  $("loginView").classList.add("hidden");
  $("adminView").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("adminWelcome").textContent = "مرحبًا 👋";

  try{ await loadAllAdminData(); }
  catch(e){
    console.error(e);
    setToast(toast, "تعذر تحميل بيانات الإدارة: " + (e?.message || e), "err");
    toast.classList.remove("hidden");
  }
};

window.logout = async function(){
  try{ await supabaseClient.auth.signOut(); }catch(e){}
  $("adminView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("logoutBtn").classList.add("hidden");
};

/** guard */
(async function(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session?.user?.id) return;
  try{
    const ok = await isAdminByRPC();
    if(!ok) return;
    $("loginView").classList.add("hidden");
    $("adminView").classList.remove("hidden");
    $("logoutBtn").classList.remove("hidden");
    $("adminWelcome").textContent = "مرحبًا 👋";
    await loadAllAdminData();
  }catch(e){ }
})();

/** ====== Settings ====== **/
const defaultSettings = {
  topbar:"توصيل راقٍ واختيارات مختارة بعناية من REFAEI",
  brandName:"REFAEI",
  heroTitle:"REFAEI",
  heroDescription:"أقمشة مختارة، شالات كشميرية، ومسابيح بطابع فاخر",
  aboutTitle:"عن REFAEI",
  aboutText:"نختار لكم المنتجات بعناية لنقدم منتجات تجمع بين الجودة والذوق والأصالة.",
  footer:"© 2025 REFAEI — جميع الحقوق محفوظة",
  whatsapp:"96566771506"
};

window.saveSiteSettings = async function(){
  const payload = {
    id: 1,
    topbar: $("st_topbar").value.trim(),
    brand_name: $("st_brand_name").value.trim(),
    hero_title: $("st_hero_title").value.trim(),
    hero_description: $("st_hero_description").value.trim(),
    about_title: $("st_about_title").value.trim(),
    about_text: $("st_about_text").value.trim(),
    footer: $("st_footer").value.trim(),
    whatsapp: $("st_whatsapp").value.trim()
  };

  const res = await supabaseClient.from("site_settings").upsert(payload, { onConflict:"id" });
  if(res.error) alert("فشل حفظ الإعدادات: " + res.error.message);
  else alert("تم حفظ الإعدادات ✅");
};

async function loadSiteSettings(){
  const res = await supabaseClient.from("site_settings").select("*").eq("id",1).maybeSingle();
  if(res.error || !res.data){
    fillSettings(defaultSettings);
    return;
  }
  const row = res.data;
  fillSettings({
    topbar: row.topbar ?? defaultSettings.topbar,
    brandName: row.brand_name ?? defaultSettings.brandName,
    heroTitle: row.hero_title ?? defaultSettings.heroTitle,
    heroDescription: row.hero_description ?? defaultSettings.heroDescription,
    aboutTitle: row.about_title ?? defaultSettings.aboutTitle,
    aboutText: row.about_text ?? defaultSettings.aboutText,
    footer: row.footer ?? defaultSettings.footer,
    whatsapp: row.whatsapp ?? defaultSettings.whatsapp
  });
}

function fillSettings(s){
  $("st_topbar").value = s.topbar ?? "";
  $("st_brand_name").value = s.brandName ?? "";
  $("st_hero_title").value = s.heroTitle ?? "";
  $("st_hero_description").value = s.heroDescription ?? "";
  $("st_about_title").value = s.aboutTitle ?? "";
  $("st_about_text").value = s.aboutText ?? "";
  $("st_footer").value = s.footer ?? "";
  $("st_whatsapp").value = s.whatsapp ?? "";
}

/** ====== Load All ====== **/
async function loadAllAdminData(){
  await loadSiteSettings();
  await loadCategories();   // fills dropdown + table
  await loadProducts();
  await loadOrders();
}

/** ====== Categories ====== **/
window.createCategory = async function(){
  const name = $("cat_name").value.trim();
  if(!name) return alert("اكتب اسم القسم");

  const res = await supabaseClient.from("categories").insert({ name });
  if(res.error) return alert("فشل إضافة القسم: " + res.error.message);

  $("cat_name").value = "";
  await loadCategories();
};

async function loadCategories(){
  const res = await supabaseClient.from("categories").select("*").order("created_at",{ascending:false});
  if(res.error) return alert("فشل تحميل الأقسام: " + res.error.message);

  const categories = res.data || [];

  // ✅ table
  const tbody = $("categoriesTbody");
  tbody.innerHTML = "";

  categories.forEach(cat => {
    const id = cat.id;
    const name = cat.name ?? "";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${escapeHtml(name)}</td>
      <td>
        <div class="row-actions" style="margin-top:0;">
          <button class="btn btn-secondary" style="padding:8px 12px;" type="button"
            onclick="window.promptEditCategory('${id}','${escapeHtml(name)}')">تعديل</button>
          <button class="btn" style="padding:8px 12px; background:#b84038;" type="button"
            onclick="window.deleteCategory('${id}')">حذف</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  // ✅ dropdown for products
  const select = $("p_category");
  select.innerHTML = "";

  const has = categories.length > 0;
  if(!has){
    select.innerHTML = `<option value="">لا توجد أقسام</option>`;
  }else{
    categories.forEach(cat => {
      const n = cat.name ?? "";
      const opt = document.createElement("option");
      opt.value = n;
      opt.textContent = n;
      select.appendChild(opt);
    });
  }
}

window.promptEditCategory = async function(id, currentName){
  const newName = prompt("تعديل اسم القسم:", currentName);
  if(newName === null) return;
  const res = await supabaseClient.from("categories").update({ name: newName.trim() }).eq("id", id);
  if(res.error) return alert("فشل التعديل: " + res.error.message);
  await loadCategories();
  alert("تم التعديل ✅");
};

window.deleteCategory = async function(id){
  if(!confirm("تأكيد حذف القسم؟")) return;
  const res = await supabaseClient.from("categories").delete().eq("id", id);
  if(res.error) return alert("فشل الحذف: " + res.error.message);
  await loadCategories();
  await loadProducts();
};

/** ====== Products (Create/Edit) ====== **/
window.createProduct = async function(){
  const pName = $("p_name").value.trim();
  const pCategory = $("p_category").value.trim();
  const pDescription = $("p_description").value.trim();
  const pPrice = Number($("p_price").value || 0);
  const pStock = Number($("p_stock").value || 0);

  if(!pName || !pCategory){
    return alert("أدخل اسم المنتج واختر القسم");
  }

  const file = pendingUploadFile; // from fixed input
  pendingUploadFile = null; // reset after read

  const insertRes = await supabaseClient.from("products").insert({
    name: pName,
    category: pCategory,
    description: pDescription,
    price: pPrice,
    stock: pStock,
    image_url: null
  }).select().maybeSingle();

  if(insertRes.error) return alert("فشل إضافة المنتج: " + insertRes.error.message);

  const newId = insertRes.data?.id;
  if(!newId) return alert("تمت الإضافة لكن تعذر جلب id");

  try{
    if(file){
      const finalUrl = await uploadImageFile(file, `product-${newId}`);
      if(finalUrl){
        const up = await supabaseClient.from("products").update({ image_url: finalUrl }).eq("id", newId);
        if(up.error) throw up.error;
      }
    }
  }catch(e){
    console.error(e);
    alert("تمت الإضافة لكن فشل رفع الصورة: " + (e?.message || e));
  }

  // reset UI
  $("p_name").value = "";
  $("p_category").value = "";
  $("p_description").value = "";
  $("p_price").value = "";
  $("p_stock").value = "";
  $("p_image_preview").textContent = "لم يتم اختيار صورة";

  await loadProducts();
};

async function getProductById(id){
  const res = await supabaseClient.from("products").select("*").eq("id", id).maybeSingle();
  if(res.error || !res.data) throw new Error("تعذر جلب المنتج");
  return res.data;
}

window.promptEditProduct = async function(id){
  const p = await getProductById(id);

  const newName = prompt("اسم المنتج:", p.name ?? "");
  if(newName === null) return;

  // ✅ قسم من dropdown: نعرض prompt بسيط مع قائمة الأقسام (بدون إدخال حر)
  // (إذا تحب modal حقيقي dropdown داخل التعديل أعطيك نسخة ثانية)
  const catList = $("p_category").options;
  const catNames = [];
  for(let i=0;i<catList.length;i++) catNames.push(catList[i].value);

  const newCat = prompt(
    "اختر القسم من القائمة بالضبط:\n- " + catNames.join("\n- "),
    p.category ?? p.category_name ?? ""
  );
  if(newCat === null) return;

  const newDesc = prompt("الوصف:", p.description ?? "");
  if(newDesc === null) return;

  const newPrice = prompt("السعر:", String(p.price ?? 0));
  if(newPrice === null) return;

  const newStock = prompt("stock:", String(p.stock ?? 0));
  if(newStock === null) return;

  const wantUpload = confirm("هل تريد رفع صورة من جهازك؟ (OK = نعم، Cancel = بدون تغيير صورة)");
  let file = null;
  if(wantUpload){
    // open fixed chooser
    window.openUploadFromUI('edit', id);
    alert("اختر الصورة الآن من نافذة الرفع (ثم سيتم تحديث المنتج).");
    // لازم ننتظر اختيار المستخدم.
    file = await new Promise(resolve => {
      const t = setInterval(() => {
        if(pendingUploadFile){
          resolve(pendingUploadFile);
          clearInterval(t);
        }
      }, 150);
    });
    pendingUploadFile = null;
  }

  const payload = {
    name: newName.trim(),
    category: newCat.trim(),
    description: newDesc.trim(),
    price: Number(newPrice || 0),
    stock: Number(newStock || 0)
  };

  // update base
  const up = await supabaseClient.from("products").update(payload).eq("id", id);
  if(up.error) return alert("فشل التعديل: " + up.error.message);

  // update image if uploaded
  if(file){
    try{
      const finalUrl = await uploadImageFile(file, `product-${id}`);
      if(finalUrl){
        const up2 = await supabaseClient.from("products").update({ image_url: finalUrl }).eq("id", id);
        if(up2.error) throw up2.error;
      }
    }catch(e){
      console.error(e);
      alert("تم التعديل لكن فشل رفع/حفظ الصورة: " + (e?.message || e));
    }
  }

  await loadProducts();
  alert("تم التعديل ✅");
};

window.deleteProduct = async function(id){
  if(!confirm("تأكيد حذف المنتج؟")) return;
  const res = await supabaseClient.from("products").delete().eq("id", id);
  if(res.error) return alert("فشل الحذف: " + res.error.message);
  await loadProducts();
};

async function loadProducts(){
  const res = await supabaseClient.from("products").select("*").order("created_at",{ascending:false});
  if(res.error) return alert("فشل تحميل المنتجات: " + res.error.message);

  const tbody = $("productsTbody");
  tbody.innerHTML = "";

  (res.data || []).forEach(p => {
    const id = p.id;
    const name = p.name ?? "";
    const category = p.category ?? p.category_name ?? "";
    const price = Number(p.price ?? 0).toFixed(2);
    const stock = Number(p.stock ?? 0);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><b>${escapeHtml(name)}</b></td>
      <td>${escapeHtml(category)}</td>
      <td>${price} د.ك</td>
      <td>${stock <= 0 ? `<span class="badge red">نفدت</span>` : `<span class="badge">${stock}</span>`}</td>
      <td>
        <div class="row-actions">
          <button class="btn btn-secondary" style="padding:8px 12px;" type="button"
            onclick="window.promptEditProduct('${id}')">تعديل</button>
          <button class="btn" style="padding:8px 12px; background:#b84038;" type="button"
            onclick="window.deleteProduct('${id}')">حذف</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

/** ====== Orders (display only) ====== **/
async function loadOrders(){
  const res = await supabaseClient.from("orders").select("*").order("created_at",{ascending:false});
  if(res.error) return alert("فشل تحميل الطلبات: " + res.error.message);

  const tbody = $("ordersTbody");
  tbody.innerHTML = "";

  (res.data || []).slice(0, 100).forEach(o => {
    const id = o.id;
    const customer = o.customer_name ?? "";
    const phone = o.phone ?? "";
    const address = o.address ?? "";
    const items = o.items ?? [];
    const total = Number(o.total ?? 0).toFixed(2);
    const created_at = o.created_at ? new Date(o.created_at).toLocaleString("ar") : "";

    let itemsText = "";
    try{
      if(Array.isArray(items)){
        itemsText = items.map(it => `${it.name} × ${it.quantity}`).join("<br>");
      }else{
        itemsText = typeof items === "string" ? items : "";
      }
    }catch(e){ itemsText = ""; }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <b>${escapeHtml(customer)}</b>
        <div style="color:#cbbca8;font-size:12px;">${escapeHtml(phone)}</div>
        <div style="color:#cbbca8;font-size:12px;">${escapeHtml(address)}</div>
      </td>
      <td>${itemsText || "<span style='color:#cbbca8;'>بدون تفاصيل</span>"}</td>
      <td>${total} د.ك</td>
      <td>${escapeHtml(created_at)}</td>
      <td>
        <button class="btn" style="background:#b84038;padding:8px 12px;"
          onclick="window.deleteOrder('${id}')">حذف</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

window.deleteOrder = async function(id){
  if(!confirm("حذف هذا الطلب؟")) return;
  const res = await supabaseClient.from("orders").delete().eq("id", id);
  if(res.error) return alert("فشل الحذف: " + res.error.message);
  await loadOrders();
};
</script>
