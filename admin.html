<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الإدارة - REFAEI</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap');
    :root{
      --bg:#eee9df; --brown:#4b2718; --brown-dark:#2b160d; --border:#d9cebd; --gold:#b89557;
      --green:#198754; --red:#b84038; --shadow-soft:0 8px 25px rgba(75,39,24,.08);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      background:
        radial-gradient(circle at 15% 10%,rgba(184,149,87,.12),transparent 25%),
        radial-gradient(circle at 90% 30%,rgba(75,39,24,.08),transparent 28%),
        var(--bg);
      color:var(--brown-dark);
      font-family:'Cairo',Tahoma,Arial,sans-serif;
      line-height:1.8;
      overflow-x:hidden;
    }
    .container{ width:min(1200px,92%); margin:auto; }
    .hidden{ display:none!important; }
    .header{
      position:sticky; top:0; z-index:20;
      background:rgba(248,245,239,.88);
      border-bottom:1px solid rgba(75,39,24,.13);
      backdrop-filter:blur(18px);
      box-shadow:0 5px 25px rgba(75,39,24,.05);
    }
    .nav{
      min-height:78px; display:flex; align-items:center; justify-content:space-between; gap:25px; padding:10px 0;
    }
    .brand{ display:flex; align-items:center; gap:10px; }
    .brand-mark{
      width:44px; height:44px; display:grid; place-items:center;
      border:1px solid var(--gold); border-radius:50%;
      background: radial-gradient(circle,#fff8e9 0 55%,transparent 56%), var(--brown);
      color:#d7bd86; font-size:22px;
    }
    .brand-name{
      font-family:'Playfair Display',Georgia,serif;
      font-weight:800; font-size:22px; letter-spacing:3px; color:var(--brown);
    }
    .btn{
      border:0; background:var(--brown); color:#fff; padding:10px 14px; border-radius:4px; cursor:pointer;
      box-shadow:0 10px 22px rgba(75,39,24,.12);
    }
    .btn:hover{ background:var(--gold); transform:translateY(-2px); }
    .btn-secondary{
      background:transparent; border:1px solid var(--brown); color:var(--brown); box-shadow:none;
    }
    .btn-secondary:hover{ background:var(--brown); color:#fff; border-color:var(--brown); }
    .card{
      background:rgba(255,253,249,.92);
      border:1px solid var(--border); border-radius:8px; padding:18px;
      box-shadow:var(--shadow-soft);
    }
    .section-title{
      margin-bottom:10px;
      font-family:'Playfair Display',Georgia,serif;
      color:var(--brown); font-size:24px; font-weight:800;
    }
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:900px){ .grid{ grid-template-columns:1fr; } }
    .field{ display:flex; flex-direction:column; gap:7px; margin:10px 0; }
    .field label{ font-size:13px; color:#6e5a4c; font-weight:bold; }
    .field input, .field textarea{
      width:100%;
      padding:11px; border-radius:6px; border:1px solid var(--border);
      background:#fffdf9; outline:none;
    }
    .field textarea{ resize:vertical; min-height:90px; }
    .toast{
      padding:12px; border-radius:8px;
      border:1px solid rgba(75,39,24,.15); background:rgba(255,253,249,.9); color:var(--brown);
    }
    .toast.ok{ border-color:rgba(25,135,84,.28); background:rgba(25,135,84,.08); }
    .toast.err{ border-color:rgba(184,56,56,.25); background:rgba(184,56,56,.10); }
    .table{
      width:100%; border-collapse:collapse; border-radius:8px; overflow:hidden;
      border:1px solid var(--border); background:#fffdf9;
    }
    .table th,.table td{
      padding:12px 10px; border-bottom:1px solid rgba(75,39,24,.08); font-size:13px; vertical-align:top;
    }
    .table th{ color:var(--brown); font-weight:800; background:rgba(184,149,87,.10); }
    hr.sep{ border:0; height:1px; background:rgba(75,39,24,.12); margin:18px 0; }
    .small-muted{ color:#7a6658; font-size:12px; }
    .badge{
      display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:800;
      background:rgba(184,149,87,.18); color:var(--brown); border:1px solid rgba(184,149,87,.35);
    }
    .badge.red{ background:rgba(184,56,56,.12); border-color:rgba(184,56,56,.25); color:#8d1f1f; }
    .row-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  </style>
</head>

<body>
<header class="header">
  <div class="container nav">
    <div class="brand">
      <span class="brand-mark">𓅃</span>
      <span class="brand-name">REFAEI - الإدارة</span>
    </div>
    <div>
      <button id="logoutBtn" class="btn btn-secondary hidden" type="button" onclick="window.logout()">تسجيل خروج</button>
    </div>
  </div>
</header>

<main class="container" style="padding:22px 0 60px;">
  <!-- LOGIN -->
  <section id="loginView" class="card">
    <h2 class="section-title">تسجيل دخول الإدارة</h2>
    <div id="loginToast" class="toast err hidden"></div>

    <div class="grid" style="margin-top:12px;">
      <div>
        <div class="field">
          <label>الإيميل</label>
          <input id="adminEmail" placeholder="اكتب الإيميل" autocomplete="email" />
        </div>

        <div class="field">
          <label>كلمة المرور</label>
          <input id="adminPassword" type="password" placeholder="اكتب كلمة المرور" autocomplete="current-password" />
        </div>

        <div class="row-actions">
          <button class="btn" type="button" onclick="window.loginAdmin()">دخول</button>
        </div>
      </div>

      <div>
        <div class="toast" style="border-style:dashed;"></div>
      </div>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="adminView" class="hidden">
    <div class="toast ok" id="adminWelcome" style="margin-bottom:14px;"></div>

    <div class="card" style="margin-top:14px;">
      <h2 class="section-title">إعدادات الموقع</h2>

      <div class="grid">
        <div>
          <div class="field"><label>Topbar</label><textarea id="st_topbar"></textarea></div>
          <div class="field"><label>Brand Name</label><input id="st_brand_name" /></div>
          <div class="field"><label>Hero Title</label><input id="st_hero_title" /></div>
          <div class="field"><label>Hero Description</label><textarea id="st_hero_description"></textarea></div>
        </div>

        <div>
          <div class="field"><label>About Title</label><input id="st_about_title" /></div>
          <div class="field"><label>About Text</label><textarea id="st_about_text"></textarea></div>
          <div class="field"><label>Footer</label><textarea id="st_footer"></textarea></div>
          <div class="field"><label>WhatsApp (رقم بدون رابط)</label><input id="st_whatsapp" /></div>
          <div class="row-actions">
            <button class="btn" type="button" onclick="window.saveSiteSettings()">حفظ الإعدادات</button>
          </div>
        </div>
      </div>
    </div>

    <hr class="sep">

    <div class="card">
      <h2 class="section-title">الأقسام</h2>
      <div class="grid">
        <div>
          <div class="field"><label>اسم القسم</label><input id="cat_name" placeholder="مثال: قماش / شال / مسابيح" /></div>
          <div class="row-actions">
            <button class="btn" type="button" onclick="window.createCategory()">إضافة قسم</button>
          </div>
        </div>
        <div>
          <table class="table" aria-label="categories">
            <thead>
              <tr>
                <th>الاسم</th>
                <th style="width:220px;">إجراءات</th>
              </tr>
            </thead>
            <tbody id="categoriesTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <hr class="sep">

    <div class="card">
      <h2 class="section-title">المنتجات</h2>
      <div class="grid">
        <div>
          <div class="field"><label>اسم المنتج</label><input id="p_name" /></div>
          <div class="field">
            <label>القسم (category_name)</label>
            <input id="p_category" />
            <div class="small-muted" style="margin-top:2px;">الأفضل تطابق اسم القسم الموجود.</div>
          </div>
          <div class="field"><label>وصف المنتج</label><textarea id="p_description"></textarea></div>
          <div class="field"><label>السعر (دينار)</label><input id="p_price" type="number" step="0.01" /></div>
          <div class="field"><label>الكمية (stock)</label><input id="p_stock" type="number" step="1" /></div>
          <div class="field"><label>صورة المنتج (URL أو اتركه فارغ)</label><input id="p_image_url" placeholder="https://..." /></div>
          <div class="row-actions">
            <button class="btn" type="button" onclick="window.createProduct()">إضافة منتج</button>
          </div>
        </div>

        <div>
          <table class="table" aria-label="products">
            <thead>
              <tr>
                <th>المنتج</th>
                <th>القسم</th>
                <th>السعر</th>
                <th>Stock</th>
                <th style="width:230px;">إجراءات</th>
              </tr>
            </thead>
            <tbody id="productsTbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <hr class="sep">

    <div class="card">
      <h2 class="section-title">طلبات العملاء</h2>
      <table class="table" aria-label="orders">
        <thead>
          <tr>
            <th style="width:180px;">العميل</th>
            <th>الطلبات</th>
            <th style="width:110px;">الإجمالي</th>
            <th style="width:170px;">تاريخ</th>
            <th style="width:120px;">حذف</th>
          </tr>
        </thead>
        <tbody id="ordersTbody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
/** ====== CONFIG (غير هذه القيم ببياناتك) ====== **/
const SUPABASE_URL = "https://mvsdblzjzrscnfgiqxan.supabase.co";
const SUPABASE_KEY = "sb_publishable_KWMjd7EDbWtH2Ay7TdJwZg_s2et1Hc7";

/** ====== Supabase client (تجنب اسم supabase لتفادي التعارض) ====== **/
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/** ====== Helpers ====== **/
function $(id){ return document.getElementById(id); }

function setToast(el, msg, type="err"){
  el.textContent = msg;
  el.classList.remove("hidden");
  el.classList.toggle("ok", type==="ok");
  el.classList.toggle("err", type==="err");
}

function escapeHtml(str){
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/** ====== State ====== **/
const defaultSettings = {
  topbar:"توصيل راقٍ واختيارات مختارة بعناية من REFAEI",
  brandName:"REFAEI",
  heroTitle:"REFAEI",
  heroDescription:"أقمشة مختارة، شالات كشميرية، ومسابيح بطابع فاخر",
  aboutTitle:"عن REFAEI",
  aboutText:"نختار لكم المنتجات بعناية لنقدم منتجات تجمع بين الجودة والذوق والأصالة.",
  footer:"© 2025 REFAEI — جميع الحقوق محفوظة",
  whatsapp:"96566771506"
};

/** ====== UI Actions ====== **/
window.loginAdmin = async function(){
  const email = $("adminEmail").value.trim();
  const password = $("adminPassword").value;

  $("loginToast").classList.add("hidden");

  if(!email) return setToast($("loginToast"), "أدخل الإيميل", "err"), $("loginToast").classList.remove("hidden");
  if(!password) return setToast($("loginToast"), "أدخل كلمة المرور", "err"), $("loginToast").classList.remove("hidden");

  const signInRes = await supabaseClient.auth.signInWithPassword({ email, password });
  if(signInRes.error){
    setToast($("loginToast"), "بيانات الدخول غير صحيحة: " + signInRes.error.message, "err");
    $("loginToast").classList.remove("hidden");
    return;
  }

  const user = signInRes.data?.user;
  if(!user?.id){
    setToast($("loginToast"), "تعذر الحصول على المستخدم بعد تسجيل الدخول", "err");
    $("loginToast").classList.remove("hidden");
    return;
  }

  // تحقق من admin_users
  const checkRes = await supabaseClient
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if(checkRes.error){
    setToast($("loginToast"), "خطأ بالصلاحيات: " + checkRes.error.message, "err");
    $("loginToast").classList.remove("hidden");
    return;
  }

  if(!checkRes.data){
    setToast($("loginToast"), "غير مصرح لك بدخول لوحة الإدارة", "err");
    $("loginToast").classList.remove("hidden");
    return;
  }

  $("loginView").classList.add("hidden");
  $("adminView").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("adminWelcome").textContent = "مرحبًا 👋";

  try{
    await loadAllAdminData();
  }catch(e){
    console.error(e);
    setToast($("loginToast"), "تعذر تحميل بيانات الإدارة: " + (e?.message || e), "err");
    $("loginToast").classList.remove("hidden");
  }
};

window.logout = async function(){
  try{ await supabaseClient.auth.signOut(); }catch(e){ console.error(e); }

  $("adminView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("logoutBtn").classList.add("hidden");
};

window.saveSiteSettings = async function(){
  const payload = {
    id: 1,
    topbar: $("st_topbar").value.trim(),
    brand_name: $("st_brand_name").value.trim(),
    hero_title: $("st_hero_title").value.trim(),
    hero_description: $("st_hero_description").value.trim(),
    about_title: $("st_about_title").value.trim(),
    about_text: $("st_about_text").value.trim(),
    footer: $("st_footer").value.trim(),
    whatsapp: $("st_whatsapp").value.trim()
  };

  const res = await supabaseClient.from("site_settings").upsert(payload, { onConflict: "id" });
  if(res.error) return alert("فشل حفظ الإعدادات: " + res.error.message);
  alert("تم حفظ الإعدادات ✅");
};

/** ====== Guard on load ====== **/
async function guardOnLoad(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session?.user?.id) return;

  const checkRes = await supabaseClient
    .from("admin_users")
    .select("user_id")
    .eq("user_id", session.user.id)
    .maybeSingle();

  if(checkRes.error || !checkRes.data) return;

  $("loginView").classList.add("hidden");
  $("adminView").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("adminWelcome").textContent = "مرحبًا 👋";

  await loadAllAdminData();
}
guardOnLoad();

/** ====== Data Load ====== **/
async function loadAllAdminData(){
  await loadSiteSettings();
  await loadCategories();
  await loadProducts();
  await loadOrders();
}

async function loadSiteSettings(){
  const res = await supabaseClient
    .from("site_settings")
    .select("*")
    .eq("id", 1)
    .maybeSingle();

  if(res.error || !res.data){
    fillSettings(defaultSettings);
    return;
  }

  const row = res.data;
  fillSettings({
    topbar: row.topbar ?? defaultSettings.topbar,
    brandName: row.brand_name ?? defaultSettings.brandName,
    heroTitle: row.hero_title ?? defaultSettings.heroTitle,
    heroDescription: row.hero_description ?? defaultSettings.heroDescription,
    aboutTitle: row.about_title ?? defaultSettings.aboutTitle,
    aboutText: row.about_text ?? defaultSettings.aboutText,
    footer: row.footer ?? defaultSettings.footer,
    whatsapp: row.whatsapp ?? defaultSettings.whatsapp
  });
}

function fillSettings(s){
  $("st_topbar").value = s.topbar ?? "";
  $("st_brand_name").value = s.brandName ?? "";
  $("st_hero_title").value = s.heroTitle ?? "";
  $("st_hero_description").value = s.heroDescription ?? "";
  $("st_about_title").value = s.aboutTitle ?? "";
  $("st_about_text").value = s.aboutText ?? "";
  $("st_footer").value = s.footer ?? "";
  $("st_whatsapp").value = s.whatsapp ?? "";
}

/** ====== Categories ====== **/
window.createCategory = async function(){
  const name = $("cat_name").value.trim();
  if(!name) return alert("اكتب اسم القسم");

  const res = await supabaseClient.from("categories").insert({ name });
  if(res.error) return alert("فشل إضافة القسم: " + res.error.message);

  $("cat_name").value = "";
  await loadCategories();
};

async function loadCategories(){
  const res = await supabaseClient.from("categories").select("*").order("created_at", { ascending:false });
  if(res.error) return alert("فشل تحميل الأقسام: " + res.error.message);

  const tbody = $("categoriesTbody");
  tbody.innerHTML = "";

  (res.data || []).forEach(cat => {
    const id = cat.id;
    const name = cat.name ?? "";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${escapeHtml(name)}</td>
      <td>
        <div class="row-actions" style="margin-top:0;">
          <button class="btn btn-secondary" style="padding:8px 12px;" type="button"
            onclick="window.promptEditCategory('${id}','${escapeHtml(name)}')">تعديل</button>
          <button class="btn" style="padding:8px 12px; background: var(--red);" type="button"
            onclick="window.deleteCategory('${id}')">حذف</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

window.promptEditCategory = async function(id, currentName){
  const newName = prompt("تعديل اسم القسم:", currentName);
  if(newName === null) return;

  const res = await supabaseClient.from("categories").update({ name: newName.trim() }).eq("id", id);
  if(res.error) return alert("فشل التعديل: " + res.error.message);

  await loadCategories();
  alert("تم التعديل ✅");
};

window.deleteCategory = async function(id){
  if(!confirm("تأكيد حذف القسم؟")) return;
  const res = await supabaseClient.from("categories").delete().eq("id", id);
  if(res.error) return alert("فشل الحذف: " + res.error.message);
  await loadCategories();
  await loadProducts();
};

/** ====== Products ====== **/
window.createProduct = async function(){
  const payload = {
    name: $("p_name").value.trim(),
    category: null,
    category_name: $("p_category").value.trim(),
    description: $("p_description").value.trim(),
    price: Number($("p_price").value || 0),
    stock: Number($("p_stock").value || 0),
    image_url: $("p_image_url").value.trim() || null
  };

  if(!payload.name || !payload.category_name) return alert("أدخل اسم المنتج واسم القسم");

  const res = await supabaseClient.from("products").insert(payload);
  if(res.error) return alert("فشل إضافة المنتج: " + res.error.message);

  $("p_name").value = "";
  $("p_description").value = "";
  $("p_price").value = "";
  $("p_stock").value = "";
  $("p_image_url").value = "";

  await loadProducts();
};

async function loadProducts(){
  const res = await supabaseClient.from("products").select("*").order("created_at", { ascending:false });
  if(res.error) return alert("فشل تحميل المنتجات: " + res.error.message);

  const tbody = $("productsTbody");
  tbody.innerHTML = "";

  (res.data || []).forEach(p => {
    const id = p.id;
    const name = p.name ?? "";
    const category = p.category_name ?? p.category ?? "";
    const price = Number(p.price ?? 0).toFixed(2);
    const stock = Number(p.stock ?? 0);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><b>${escapeHtml(name)}</b></td>
      <td>${escapeHtml(category)}</td>
      <td>${price} د.ك</td>
      <td>${stock <= 0 ? `<span class="badge red">نفدت</span>` : `<span class="badge">${stock}</span>`}</td>
      <td>
        <div class="row-actions" style="margin-top:0;">
          <button class="btn btn-secondary" style="padding:8px 12px;" type="button"
            onclick="window.promptEditProduct('${id}')">تعديل</button>
          <button class="btn" style="padding:8px 12px; background: var(--red);" type="button"
            onclick="window.deleteProduct('${id}')">حذف</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

window.promptEditProduct = async function(id){
  const res = await supabaseClient.from("products").select("*").eq("id", id).maybeSingle();
  if(res.error || !res.data) return alert("فشل جلب بيانات المنتج");

  const p = res.data;

  const newName = prompt("اسم المنتج:", p.name ?? "");
  if(newName === null) return;

  const newCategory = prompt("اسم القسم (category_name):", p.category_name ?? p.category ?? "");
  if(newCategory === null) return;

  const newDesc = prompt("الوصف:", p.description ?? "");
  if(newDesc === null) return;

  const newPrice = prompt("السعر:", String(p.price ?? 0));
  if(newPrice === null) return;

  const newStock = prompt("stock:", String(p.stock ?? 0));
  if(newStock === null) return;

  const newImg = prompt("image_url (رابط):", p.image_url ?? "");
  if(newImg === null) return;

  const payload = {
    name: newName.trim(),
    category_name: newCategory.trim(),
    description: newDesc.trim(),
    price: Number(newPrice || 0),
    stock: Number(newStock || 0),
    image_url: newImg.trim() || null
  };

  const up = await supabaseClient.from("products").update(payload).eq("id", id);
  if(up.error) return alert("فشل التعديل: " + up.error.message);

  await loadProducts();
  alert("تم التعديل ✅");
};

window.deleteProduct = async function(id){
  if(!confirm("تأكيد حذف المنتج؟")) return;
  const res = await supabaseClient.from("products").delete().eq("id", id);
  if(res.error) return alert("فشل الحذف: " + res.error.message);
  await loadProducts();
};

/** ====== Orders ====== **/
async function loadOrders(){
  const res = await supabaseClient.from("orders").select("*").order("created_at", { ascending:false });
  if(res.error) return alert("فشل تحميل الطلبات: " + res.error.message);

  const tbody = $("ordersTbody");
  tbody.innerHTML = "";

  (res.data || []).slice(0, 100).forEach(o => {
    const id = o.id;
    const customer = o.customer_name ?? "";
    const phone = o.phone ?? "";
    const address = o.address ?? "";
    const items = o.items ?? [];
    const total = Number(o.total ?? 0).toFixed(2);
    const created_at = o.created_at ? new Date(o.created_at).toLocaleString("ar") : "";

    let itemsText = "";
    try{
      if(Array.isArray(items)){
        itemsText = items.map(it => `${it.name} × ${it.quantity}`).join("<br>");
      }else{
        itemsText = typeof items === "string" ? items : "";
      }
    }catch(e){ itemsText = ""; }

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        <b>${escapeHtml(customer)}</b>
        <div class="small-muted">${escapeHtml(phone)}</div>
        <div class="small-muted">${escapeHtml(address)}</div>
      </td>
      <td style="max-width:360px;">${itemsText || "<span class='small-muted'>بدون تفاصيل</span>"}</td>
      <td>${total} د.ك</td>
      <td>${escapeHtml(created_at)}</td>
      <td>
        <button class="btn" type="button" style="padding:8px 12px; background: var(--red);" onclick="window.deleteOrder('${id}')">حذف</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

window.deleteOrder = async function(id){
  if(!confirm("حذف هذا الطلب؟")) return;
  const res = await supabaseClient.from("orders").delete().eq("id", id);
  if(res.error) return alert("فشل حذف الطلب: " + res.error.message);
  await loadOrders();
};
</script>
</body>
</html>
